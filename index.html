<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>数学 解法パターン200選 フラッシュカード</title>
<style>
:root{--bg:#F3F5F9;--sf:#fff;--ink:#172033;--mut:#5d6677;--line:#d3d9e6;--ac:#3B4CCA;--acT:#fff;--ok:#1E8E5A;--okBg:#E1F3EA;--ng:#C93C4B;--ngBg:#FBE6E9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141B;--sf:#1A1F2A;--ink:#E7EAF3;--mut:#9AA3B5;--line:#2B3342;--ac:#8E9BFF;--acT:#10131c;--ok:#4CC68A;--okBg:#12301F;--ng:#FF7A88;--ngBg:#3A1820;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11141B;--sf:#1A1F2A;--ink:#E7EAF3;--mut:#9AA3B5;--line:#2B3342;--ac:#8E9BFF;--acT:#10131c;--ok:#4CC68A;--okBg:#12301F;--ng:#FF7A88;--ngBg:#3A1820;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:600px;margin:0 auto;padding:20px 16px 40px}
[hidden]{display:none!important}
h1{font-size:22px;margin:8px 0 4px}
p{margin:0}
.lead{color:var(--mut);font-size:14px;margin-bottom:18px}
.sec{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.sec h3{font-size:14px;margin:0 0 10px;color:var(--mut);font-weight:600}
.seg{display:flex;gap:8px}.seg button{flex:1}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--sf);border-radius:10px;padding:10px 12px;min-height:44px}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--ac);background:var(--ac);color:var(--acT);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.primary{width:100%;background:var(--ac);color:var(--acT);border-color:var(--ac);font-weight:700;font-size:17px;min-height:52px}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}
.ghost{background:transparent;border-color:transparent;color:var(--mut);padding:8px}
.fl{font-size:13px;color:var(--mut);margin:12px 0 6px;font-weight:600}.fl:first-child{margin-top:0}
.ub{display:flex;justify-content:space-between;width:100%;text-align:left;margin-bottom:6px;min-height:44px}
.ub span:last-child{opacity:.75;font-size:14px}
.big{font-size:30px;font-weight:700;line-height:1.1}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
#prog{font-size:14px;color:var(--mut);min-width:56px;text-align:right}
.card{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-bottom:14px}
.tag{font-size:12px;color:var(--ac);border:1px solid var(--ac);border-radius:6px;padding:0 8px;display:inline-block;margin-bottom:10px}
#q{font-size:20px;font-weight:700;line-height:1.6;overflow-wrap:anywhere}
.blk{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.blk h4{margin:0 0 4px;font-size:13px;color:var(--mut);font-weight:600}
.blk div{white-space:pre-line;overflow-wrap:anywhere}
.pn{font-size:18px;font-weight:700;color:var(--ac)}
.ans{background:var(--okBg);border-radius:10px;padding:10px 12px;font-weight:700}
.no{border-color:var(--ng);color:var(--ng)}
.yes{background:var(--ok);border-color:var(--ok);color:var(--sf);font-weight:700}
ul.list{list-style:none;margin:0;padding:0}ul.list li{padding:8px 0;border-top:1px solid var(--line);font-size:14px}ul.list li:first-child{border-top:0}
ul.list b{display:block}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>

<section id="home">
  <h1>数学 解法パターン200選</h1>
  <p class="lead">設問を見て解法を考え、答えを確認して「覚えた/覚えていない」を選びます。</p>
  <div class="sec"><h3>出題方法</h3><div class="seg" id="mode"></div></div>
  <div class="sec" id="unitBox"><h3>単元(全問を演習)</h3><div id="units"></div></div>
  <div class="sec" id="cntBox"><h3>問題数</h3><div class="seg" id="cnt"></div></div>
  <button class="primary" id="go">演習を始める</button>
  <div class="sec" style="margin-top:14px">
    <h3>ストック(覚えていない問題)</h3>
    <p class="big" id="sn">0</p>
    <div class="row"><button id="stk">ストックだけ演習する</button></div>
  </div>
</section>

<section id="quiz" hidden>
  <div class="top"><button class="ghost" id="quit">やめる</button><div class="bar"><i id="bar"></i></div><span id="prog"></span></div>
  <div class="card">
    <span class="tag" id="tag"></span>
    <div id="q"></div>
    <div id="back" hidden>
      <div class="blk"><h4>解法パターン</h4><div class="pn" id="pn"></div></div>
      <div class="blk"><h4>着眼点</h4><div id="idea"></div></div>
      <div class="blk"><h4>答え</h4><div class="ans" id="ans"></div></div>
      <div class="blk"><h4>解答の流れ</h4><div id="steps"></div></div>
      <div class="blk"><h4>注意点</h4><div id="pit"></div></div>
    </div>
  </div>
  <button class="primary" id="show">答えを見る</button>
  <div class="row" id="judge" hidden><button class="no" id="bn">覚えていない</button><button class="yes" id="by">覚えた</button></div>
</section>

<section id="result" hidden>
  <div class="card"><p class="lead" id="rl" style="margin:0"></p><p class="big" id="score"></p><p id="sub" style="color:var(--mut);margin-top:6px"></p></div>
  <div class="sec" id="missWrap"><h3>今回「覚えていない」にした問題</h3><ul class="list" id="miss"></ul></div>
  <button class="primary" id="again">もう一度</button>
  <div class="row"><button id="stk2">ストックを演習</button><button id="hm">トップへ</button></div>
</section>

</main>
<script>
const DATA=[{"id":1,"f":"数学Ⅰ","u":"数と式・集合と命題","n":"たすき掛けによる因数分解","q":"6x²+x−12 を因数分解せよ。","i":"x²の係数と定数項を、それぞれ積に分解し、たすき掛けして中央の項(xの係数)が合う組を探す。","s":"①6=2×3、−12=(−4)×3 などの組を並べる\n②たすき掛けして x の係数が +1 になる組を探す\n③(3x−4)(2x+3) とわかる → 展開して検算","a":"(3x−4)(2x+3)","p":"必ず展開して検算する。符号の組合せを落としやすい。"},{"id":2,"f":"数学Ⅰ","u":"数と式・集合と命題","n":"置き換えによる因数分解","q":"(x²+3x)²−2(x²+3x)−8 を因数分解せよ。","i":"同じ式のかたまりが2回以上出てくるときは、t とおいて t の2次式にして因数分解する。","s":"①t=x²+3x とおく\n②t²−2t−8=(t−4)(t+2)\n③t をもとに戻す → (x²+3x−4)(x²+3x+2)\n④それぞれをさらに因数分解する","a":"(x+4)(x−1)(x+1)(x+2)","p":"戻した後の式がまだ因数分解できないか必ず確認する(途中で止めない)。"},{"id":3,"f":"数学Ⅰ","u":"数と式・集合と命題","n":"1つの文字について整理して因数分解","q":"x²+3xy+2y²+2x+3y+1 を因数分解せよ。","i":"2文字以上の式は、1つの文字(x)について降べきの順に整理し、他の文字の式を係数とみてたすき掛けする。","s":"①x について整理: x²+(3y+2)x+(2y²+3y+1)\n②定数部分を因数分解: 2y²+3y+1=(2y+1)(y+1)\n③たすき掛け: (x+y+1)(x+2y+1)","a":"(x+y+1)(x+2y+1)","p":"整理した後の「定数部分」もまず因数分解してから、たすき掛けを考える。"},{"id":4,"f":"数学Ⅰ","u":"数と式・集合と命題","n":"輪環の形の因数分解","q":"a²(b−c)+b²(c−a)+c²(a−b) を因数分解せよ。","i":"3文字が輪のように入れ替わる式は、どれか1文字(a)について整理して共通因数 (b−c) をくくり出す。","s":"①a について整理: (b−c)a²−(b²−c²)a+bc(b−c)\n②b²−c²=(b−c)(b+c) を使い (b−c) でくくる\n③(b−c){a²−(b+c)a+bc}=(b−c)(a−b)(a−c)","a":"(a−b)(b−c)(a−c)  [= −(a−b)(b−c)(c−a)]","p":"因数の向き(a−c と c−a)で符号が変わる。a,b,c に数値を入れて検算する。"},{"id":5,"f":"数学Ⅰ","u":"数と式・集合と命題","n":"対称式の値(基本対称式で表す)","q":"x=(3+√5)/2, y=(3−√5)/2 のとき、x²+y² と x³+y³ の値を求めよ。","i":"対称式は x+y と xy で表す。x²+y²=(x+y)²−2xy、x³+y³=(x+y)³−3xy(x+y)。","s":"①x+y=3、xy=(9−5)/4=1\n②x²+y²=3²−2·1=7\n③x³+y³=3³−3·1·3=18","a":"x²+y²=7, x³+y³=18","p":"x,y を直接代入して計算しようとしない。先に x+y, xy を求める方が速く、ミスも少ない。"},{"id":6,"f":"数学Ⅰ","u":"数と式・集合と命題","n":"二重根号をはずす","q":"√(7+2√10) と √(8−√48) を、それぞれ二重根号をはずして簡単にせよ。","i":"√(p±2√q) は、足して p・掛けて q になる2数 a,b(a>b)を探し √a±√b にする。√の前が 2 でない形は 2√ の形に直す。","s":"①√(7+2√10): 和7・積10 → 5と2 → √5+√2\n②√48=2√12 より √(8−2√12): 和8・積12 → 6と2\n③引き算なので 大−小: √6−√2","a":"√5+√2, √6−√2","p":"「2√」の形になっているかを最初に確認する。引き算のときは(大きい方)−(小さい方)。"},{"id":7,"f":"数学Ⅰ","u":"数と式・集合と命題","n":"整数部分・小数部分と式の値","q":"x=1/(√5−2) の整数部分を a、小数部分を b とする。a, b の値と b²+4b の値を求めよ。","i":"分母を有理化して x を簡単にし、整数部分を不等式で決める。小数部分=x−(整数部分)。b+2=√5 のように関係式を作って次数を下げる。","s":"①有理化して x=√5+2\n②4<√5+2<5 より a=4\n③b=x−4=√5−2\n④b+2=√5 の両辺を2乗して b²+4b+4=5 → b²+4b=1","a":"a=4, b=√5−2, b²+4b=1","p":"小数部分は「x から整数部分を引いたもの」。√5 は 2<√5<3 と評価する。"},{"id":8,"f":"数学Ⅰ","u":"数と式・集合と命題","n":"絶対値を含む方程式","q":"|x−2|=3x を解け。","i":"絶対値の中身の符号で場合分けして絶対値をはずす。求めた解は場合分けの範囲に合うか必ず確認する。","s":"①x≧2 のとき x−2=3x → x=−1(x≧2 に反するので不適)\n②x<2 のとき −(x−2)=3x → x=1/2(x<2 を満たす)\n③x=1/2 のとき 3x≧0 も満たす","a":"x=1/2","p":"解を場合分けの範囲に戻して確認する。右辺が負にならないこと(3x≧0)も確認する。"},{"id":9,"f":"数学Ⅰ","u":"数と式・集合と命題","n":"絶対値を2つ含む不等式","q":"|x−1|+|x−3|≦4 を解け。","i":"絶対値の中身が 0 になる点(x=1, 3)で数直線を区切り、範囲ごとに場合分けして絶対値をはずす。","s":"①x<1: (1−x)+(3−x)=4−2x≦4 → x≧0 より 0≦x<1\n②1≦x<3: (x−1)+(3−x)=2≦4 → 常に成り立つ\n③x≧3: 2x−4≦4 → x≦4 より 3≦x≦4\n④3つを合わせて 0≦x≦4","a":"0≦x≦4","p":"最後は3つの結果の「和(合わせたもの)」を答える。境界の等号はどこか1つに入れる。"},{"id":10,"f":"数学Ⅰ","u":"数と式・集合と命題","n":"連立不等式と整数解の個数","q":"連立不等式 2x−1>x+2, x≦a を満たす整数 x がちょうど3個となるような定数 a の範囲を求めよ。","i":"各不等式を解いて数直線にかき、整数がちょうど○個入るように端点の位置(等号の有無)を調べる。","s":"①第1式: x>3\n②整数解がちょうど3個 → 4, 5, 6\n③x≦a に 6 が含まれ、7 は含まれない → 6≦a<7","a":"6≦a<7","p":"端点の等号に注意(a=6 は適する、a=7 は適さない)。"},{"id":11,"f":"数学Ⅰ","u":"数と式・集合と命題","n":"文字係数の1次不等式","q":"不等式 ax+1>x+3 を解け。","i":"(係数)x>(定数) の形に整理し、x の係数の正・0・負で場合分けする。","s":"①整理して (a−1)x>2\n②a>1 のとき x>2/(a−1)\n③a=1 のとき 0·x>2 となり解なし\n④a<1 のとき 負の数で割るので不等号の向きが変わり x<2/(a−1)","a":"a>1 のとき x>2/(a−1); a=1 のとき解なし; a<1 のとき x<2/(a−1)","p":"係数が 0 の場合(a=1)を忘れない。負の数で割るときは不等号の向きを逆にする。"},{"id":12,"f":"数学Ⅰ","u":"数と式・集合と命題","n":"集合と要素の個数","q":"1から100までの整数のうち、3の倍数でも5の倍数でもない数は何個あるか。","i":"「どちらでもない」は全体からの余事象で考える。n(A∪B)=n(A)+n(B)−n(A∩B)。","s":"①3の倍数は33個、5の倍数は20個、15の倍数は6個\n②n(A∪B)=33+20−6=47\n③3の倍数でも5の倍数でもない数 = 100−47 = 53","a":"53個","p":"共通部分(15の倍数)を引き忘れない。個数は「100÷3 の整数部分」で求める。"},{"id":13,"f":"数学Ⅰ","u":"数と式・集合と命題","n":"必要条件・十分条件の判定","q":"x が実数のとき、「x>2」は「x²>4」であるための (ア)必要条件であるが十分条件でない (イ)十分条件であるが必要条件でない (ウ)必要十分条件 (エ)必要条件でも十分条件でもない のどれか。","i":"p⇒q が真なら p は q の十分条件(q は p の必要条件)。真偽は反例や集合の包含関係で調べる。","s":"①x>2 ⇒ x²>4 は真\n②x²>4 ⇒ x>2 は偽(反例: x=−3)\n③p⇒q のみ真なので p は q の十分条件","a":"(イ) 十分条件であるが必要条件でない","p":"「AはBであるための〜条件」は A⇒B の向きで考える。向きを逆にしやすい。"},{"id":14,"f":"数学Ⅰ","u":"数と式・集合と命題","n":"対偶・背理法による証明","q":"n が整数のとき、n² が偶数ならば n は偶数であることを証明せよ。","i":"直接示しにくい「pならばq」は、対偶「qでないならpでない」を示す。「〜でない」「少なくとも」「無理数」は背理法も有効。","s":"①対偶: 「n が奇数ならば n² は奇数」を示す\n②n=2k+1(k は整数)とおくと n²=4k²+4k+1=2(2k²+2k)+1\n③2k²+2k は整数なので n² は奇数 → 対偶が真 → もとの命題も真","a":"(証明)対偶「nが奇数ならn²は奇数」を n=2k+1 とおいて示す。","p":"対偶は「逆」「裏」と混同しない。n=2k+1 と整数 k をおくことを明記する。"},{"id":15,"f":"数学Ⅰ","u":"2次関数","n":"平方完成と頂点・軸","q":"y=2x²−8x+5 を平方完成し、頂点の座標と軸の方程式を求めよ。","i":"x²の係数でくくり、y=a(x−p)²+q の形にする。頂点は(p,q)、軸は x=p。","s":"①y=2(x²−4x)+5\n②=2{(x−2)²−4}+5=2(x−2)²−3\n③頂点(2,−3)、軸 x=2","a":"y=2(x−2)²−3、頂点(2,−3)、軸 x=2","p":"係数でくくった後、かっこの外に出す定数に係数(ここでは2)をかけ忘れる。"},{"id":16,"f":"数学Ⅰ","u":"2次関数","n":"頂点が与えられた2次関数の決定","q":"頂点が(1,−2)で、点(3,6)を通る放物線をグラフとする2次関数を求めよ。","i":"頂点や軸が条件にあるときは y=a(x−p)²+q とおき、通る点を代入して a を決める。","s":"①y=a(x−1)²−2 とおく\n②(3,6)を通るので 6=4a−2 → a=2\n③y=2(x−1)²−2=2x²−4x","a":"y=2x²−4x","p":"問われている形(頂点の形か展開した形か)で答える。"},{"id":17,"f":"数学Ⅰ","u":"2次関数","n":"x軸との交点が与えられた2次関数の決定","q":"x軸と x=1, x=3 で交わり、点(0,3)を通る2次関数を求めよ。","i":"x軸との交点が x=α, β のとき y=a(x−α)(x−β) とおき、他の通る点から a を決める。","s":"①y=a(x−1)(x−3) とおく\n②(0,3)を通るので 3=3a → a=1\n③y=(x−1)(x−3)=x²−4x+3","a":"y=x²−4x+3","p":"「x軸に接する」なら y=a(x−p)²、「3点を通る」なら y=ax²+bx+c と使い分ける。"},{"id":18,"f":"数学Ⅰ","u":"2次関数","n":"放物線の平行移動","q":"放物線 y=x²−2x+3 を x軸方向に2、y軸方向に−1だけ平行移動した放物線の方程式を求めよ。","i":"x軸方向に p、y軸方向に q 移動 → x を x−p、y を y−q に置き換える。頂点の移動で確認する。","s":"①平方完成して y=(x−1)²+2(頂点(1,2))\n②頂点が(1+2, 2−1)=(3,1)に移る\n③y=(x−3)²+1=x²−6x+10","a":"y=x²−6x+10","p":"x→x−p の符号を逆にしやすい。頂点がどこへ動くかで検算する。"},{"id":19,"f":"数学Ⅰ","u":"2次関数","n":"放物線の対称移動","q":"放物線 y=x²+2x+3 を (1)x軸 (2)y軸 (3)原点 に関して対称移動した放物線の方程式をそれぞれ求めよ。","i":"x軸対称→y を −y に、y軸対称→x を −x に、原点対称→両方を置き換える。","s":"①x軸: −y=x²+2x+3 → y=−x²−2x−3\n②y軸: y=(−x)²+2(−x)+3 → y=x²−2x+3\n③原点: −y=(−x)²+2(−x)+3 → y=−x²+2x−3","a":"(1)y=−x²−2x−3 (2)y=x²−2x+3 (3)y=−x²+2x−3","p":"原点対称は x と y の両方を置き換える。頂点の移動先で検算できる。"},{"id":20,"f":"数学Ⅰ","u":"2次関数","n":"定義域つきの最大・最小(軸が範囲内)","q":"2次関数 y=x²−4x+1 (0≦x≦5) の最大値と最小値を求めよ。","i":"平方完成して軸と定義域の位置を調べる。下に凸なら最小は頂点(軸が範囲内のとき)、最大は軸から遠い端点。","s":"①y=(x−2)²−3、軸 x=2 は範囲内\n②最小: x=2 のとき −3\n③x=0 で 1、x=5 で 6 → 軸から遠い x=5 で最大","a":"最大値 6 (x=5)、最小値 −3 (x=2)","p":"最大・最小をとるときの x の値も書く。端点の値は両方計算して比べる。"},{"id":21,"f":"数学Ⅰ","u":"2次関数","n":"軸が動く場合の最小値(場合分け)","q":"a は定数とする。f(x)=x²−2ax (0≦x≦2) の最小値を求めよ。","i":"軸 x=a が定義域 0≦x≦2 の左外・内部・右外のどこにあるかで場合分けする。","s":"①f(x)=(x−a)²−a²\n②a<0: x=0 で最小 f(0)=0\n③0≦a≦2: x=a で最小 −a²\n④a>2: x=2 で最小 f(2)=4−4a","a":"a<0 のとき 0; 0≦a≦2 のとき −a²; a>2 のとき 4−4a","p":"場合分けの境界(a=0, a=2)は、必ずどれか1つの場合に等号を入れる。グラフをかいて考える。"},{"id":22,"f":"数学Ⅰ","u":"2次関数","n":"定義域が動く場合の最小値(場合分け)","q":"f(x)=x²−2x (a≦x≦a+1) の最小値を a で表せ。","i":"軸 x=1 は固定で区間が動く。区間が軸の左・軸をはさむ・軸の右、の3通りで場合分けする。","s":"①f(x)=(x−1)²−1、軸 x=1\n②a+1<1(a<0): 区間が軸の左 → x=a+1 で最小 f(a+1)=a²−1\n③a≦1≦a+1(0≦a≦1): x=1 で最小 −1\n④a>1: x=a で最小 f(a)=a²−2a","a":"a<0 のとき a²−1; 0≦a≦1 のとき −1; a>1 のとき a²−2a","p":"軸が区間に入る条件は a≦1≦a+1。f(a+1) の計算で符号ミスをしやすい。"},{"id":23,"f":"数学Ⅰ","u":"2次関数","n":"最大値の場合分け(軸と区間の中央)","q":"a は定数とする。f(x)=x²−2ax (0≦x≦2) の最大値を求めよ。","i":"下に凸の関数の最大値は軸から遠い端点でとる。軸 x=a と区間の中央 x=1 の大小で場合分けする。","s":"①軸 x=a と区間の中央 x=1 を比べる\n②a<1: x=2 の方が軸から遠い → 最大 f(2)=4−4a\n③a≧1: x=0 の方が軸から遠い(a=1 は同じ距離) → 最大 f(0)=0","a":"a<1 のとき 4−4a (x=2); a≧1 のとき 0 (x=0)  [a=1 のときは x=0, 2 のどちらでも 0]","p":"最小値は3通りの場合分け、最大値は「中央との比較」の2通り。混同しない。"},{"id":24,"f":"数学Ⅰ","u":"2次関数","n":"2次不等式を解く","q":"2次不等式 2x²−5x−3≧0 を解け。","i":"左辺を因数分解(または解の公式)して 0 になる x を求め、グラフから不等号の向きに合う範囲を読む。","s":"①(2x+1)(x−3)≧0\n②2x²−5x−3=0 の解は x=−1/2, 3\n③下に凸のグラフで y≧0 となる部分 → 解の外側","a":"x≦−1/2, 3≦x","p":"「>0, ≧0」は外側、「<0, ≦0」は内側。等号の有無に注意。"},{"id":25,"f":"数学Ⅰ","u":"2次関数","n":"常に成り立つ不等式(判別式)","q":"すべての実数 x について x²−2ax+a+2>0 が成り立つような定数 a の範囲を求めよ。","i":"下に凸の2次式が常に正 ⇔ x軸と共有点をもたない ⇔ 判別式 D<0。","s":"①x²の係数が正なので D<0 を考える\n②D/4=a²−(a+2)=a²−a−2<0\n③(a−2)(a+1)<0 → −1<a<2","a":"−1<a<2","p":"「>0」は D<0、「≧0」は D≦0。x²の係数が文字なら、係数の正負・0 も場合分けする。"},{"id":26,"f":"数学Ⅰ","u":"2次関数","n":"放物線と直線の共有点の個数","q":"放物線 y=x²−2x と直線 y=2x+k の共有点の個数を、定数 k の値で場合分けして答えよ。","i":"2式から y を消去してできる2次方程式の判別式 D の符号で調べる。D>0:2個、D=0:1個(接する)、D<0:0個。","s":"①x²−2x=2x+k → x²−4x−k=0\n②D/4=4+k\n③k>−4: 2個、k=−4: 1個(接する)、k<−4: 0個","a":"k>−4 のとき2個; k=−4 のとき1個(接する); k<−4 のとき0個","p":"「=0」の形に整理してから D を計算する。"},{"id":27,"f":"数学Ⅰ","u":"2次関数","n":"解の配置①(2つの解がともに正)","q":"2次方程式 x²−2ax+a+2=0 が異なる2つの正の解をもつような定数 a の範囲を求めよ。","i":"2解がともに正 ⇔ D>0 かつ (2解の和)>0 かつ (2解の積)>0。解と係数の関係を使う。","s":"①D/4=a²−a−2>0 → a<−1, 2<a\n②和 2a>0 → a>0\n③積 a+2>0 → a>−2\n④3つの条件の共通部分をとる","a":"a>2","p":"D>0 だけでは解の符号は決まらない。最後は「すべて同時に成り立つ範囲」(共通部分)。"},{"id":28,"f":"数学Ⅰ","u":"2次関数","n":"解の配置②(2つの解がともに1より大きい)","q":"2次方程式 x²−2ax+a+2=0 が、ともに1より大きい2つの解をもつような定数 a の範囲を求めよ。","i":"f(x)=x²−2ax+a+2 のグラフで (i)D≧0 (ii)軸が1より右 (iii)f(1)>0 の3条件を考える。","s":"①D/4=a²−a−2≧0 → a≦−1, 2≦a\n②軸 x=a>1\n③f(1)=3−a>0 → a<3\n④共通部分をとる","a":"2≦a<3","p":"3条件(判別式・軸・境界の値)がそろっているか確認する。重解を含めるなら D≧0。"},{"id":29,"f":"数学Ⅰ","u":"2次関数","n":"2つの方程式の共通解","q":"2つの2次方程式 x²+ax+2=0 と x²+2x+a=0 が共通な実数解をもつような定数 a の値と、そのときの共通解を求めよ。","i":"共通解を α とおき、2式の差をとって α² の項を消去し、α の1次式として処理する。","s":"①共通解を α とおくと α²+aα+2=0 …①、α²+2α+a=0 …②\n②−①より (2−a)α+(a−2)=0 → (a−2)(α−1)=0\n③a=2 のとき2式は同じ式 x²+2x+2=0 で実数解なし → 不適\n④α=1 を①に代入: 1+a+2=0 → a=−3(②も成立)","a":"a=−3、共通解 x=1","p":"a=2(2式が一致する場合)を別に調べる。求めた a で本当に共通解をもつか確認する。"},{"id":30,"f":"数学Ⅰ","u":"2次関数","n":"条件式で1文字を消去した最大・最小","q":"x≧0, y≧0, 2x+y=4 のとき、xy の最大値を求めよ。","i":"条件式で1文字を消去して2次関数の最大・最小にする。消去した文字の条件から、残る文字の範囲を必ず求める。","s":"①y=4−2x、y≧0 より 0≦x≦2\n②xy=x(4−2x)=−2x²+4x=−2(x−1)²+2\n③x=1 は 0≦x≦2 に含まれる → 最大値 2 (x=1, y=2)","a":"最大値 2 (x=1, y=2 のとき)","p":"消去後の変数の範囲(0≦x≦2)を落とさない。頂点が範囲外なら端点で最大・最小。"},{"id":31,"f":"数学Ⅰ","u":"2次関数","n":"おき換えと変域(t の範囲に注意)","q":"y=(x²−2x)²+4(x²−2x)+1 の最小値を求めよ。","i":"共通のかたまりを t とおいて t の2次関数にする。ただし t のとりうる値の範囲(変域)を必ず調べる。","s":"①t=x²−2x=(x−1)²−1 より t≧−1\n②y=t²+4t+1=(t+2)²−3\n③頂点 t=−2 は t≧−1 の範囲外 → t=−1 で最小 y=1−4+1=−2 (x=1 のとき)","a":"最小値 −2 (x=1 のとき)","p":"t の変域を調べずに頂点を最小とする誤りが非常に多い。"},{"id":32,"f":"数学Ⅰ","u":"図形と計量","n":"三角比の相互関係(象限と符号)","q":"90°<θ<180° で sinθ=3/5 のとき、cosθ と tanθ の値を求めよ。","i":"sin²θ+cos²θ=1、tanθ=sinθ/cosθ を使う。θ の範囲から cosθ の符号を決める。","s":"①cos²θ=1−(3/5)²=16/25\n②90°<θ<180° では cosθ<0 → cosθ=−4/5\n③tanθ=sinθ/cosθ=−3/4","a":"cosθ=−4/5, tanθ=−3/4","p":"鈍角では cosθ, tanθ は負。符号の確認を忘れない。"},{"id":33,"f":"数学Ⅰ","u":"図形と計量","n":"sinθ+cosθ=k からの式の値","q":"sinθ+cosθ=1/2 のとき、sinθcosθ と sin³θ+cos³θ の値を求めよ。","i":"両辺を2乗して sinθcosθ を求める。3乗の和は (s+c)(s²−sc+c²) と変形し s²+c²=1 を使う。","s":"①2乗して 1+2sinθcosθ=1/4 → sinθcosθ=−3/8\n②sin³θ+cos³θ=(sinθ+cosθ)(1−sinθcosθ)\n③=(1/2)(1+3/8)=11/16","a":"sinθcosθ=−3/8, sin³θ+cos³θ=11/16","p":"sin²θ+cos²θ=1 を使う場面を見逃さない。対称式の考え方と同じ。"},{"id":34,"f":"数学Ⅰ","u":"図形と計量","n":"三角比の方程式(0°≦θ≦180°)","q":"0°≦θ≦180° のとき、2cos²θ−cosθ−1=0 を解け。","i":"cosθ=t(−1≦t≦1)とおいて t の2次方程式を解き、θ の範囲で角を求める。","s":"①cosθ=t とおくと 2t²−t−1=0 → (2t+1)(t−1)=0\n②t=−1/2, 1(どちらも −1≦t≦1 を満たす)\n③cosθ=−1/2 → θ=120°、cosθ=1 → θ=0°","a":"θ=0°, 120°","p":"θ=0°, 180° も範囲に含まれる。t の範囲 −1≦t≦1 を確認する。"},{"id":35,"f":"数学Ⅰ","u":"図形と計量","n":"正弦定理(外接円の半径と辺)","q":"△ABC で ∠A=30°, ∠B=45°, BC=4 のとき、外接円の半径 R と辺 CA の長さを求めよ。","i":"a/sinA=b/sinB=c/sinC=2R。「辺とその対角」の組が1組わかれば R が求まる。","s":"①BC は ∠A の対辺 → 2R=4/sin30°=8 → R=4\n②CA は ∠B の対辺 → CA=2R·sin45°=8·(√2/2)=4√2","a":"R=4, CA=4√2","p":"辺と対角の対応(BC は ∠A の対辺、CA は ∠B の対辺)を間違えない。"},{"id":36,"f":"数学Ⅰ","u":"図形と計量","n":"余弦定理(2辺とその間の角)","q":"△ABC で AB=5, AC=7, ∠A=60° のとき、BC の長さを求めよ。","i":"2辺とその間の角がわかれば、余弦定理 a²=b²+c²−2bc cosA で残りの辺が求まる。","s":"①BC²=5²+7²−2·5·7·cos60°\n②=25+49−70·(1/2)=39\n③BC=√39","a":"BC=√39","p":"使うのは「挟む角」の cos。2bc の部分の計算ミスに注意。"},{"id":37,"f":"数学Ⅰ","u":"図形と計量","n":"3辺から角の大きさと面積を求める","q":"△ABC で AB=4, BC=5, CA=6 のとき、最大の角の余弦の値と、三角形の面積を求めよ。","i":"最大辺の対角が最大角。余弦定理で cos を求め、sin=√(1−cos²) から面積 S=1/2·ac·sinB を求める。","s":"①最大辺 CA=6 の対角は ∠B\n②cosB=(4²+5²−6²)/(2·4·5)=5/40=1/8\n③sinB=√(1−1/64)=3√7/8\n④S=1/2·4·5·(3√7/8)=15√7/4","a":"cosB=1/8、面積 15√7/4","p":"0°<B<180° では sinB>0。最大の角は最大辺の対角。"},{"id":38,"f":"数学Ⅰ","u":"図形と計量","n":"三角形の面積と鈍角の三角比","q":"△ABC で AB=4, AC=6, ∠A=120° のとき、面積と BC の長さを求めよ。","i":"S=1/2·bc·sinA。鈍角では sin120°=sin60°=√3/2、cos120°=−1/2 を使う。","s":"①S=1/2·4·6·sin120°=12·(√3/2)=6√3\n②BC²=4²+6²−2·4·6·cos120°=52+24=76\n③BC=√76=2√19","a":"面積 6√3, BC=2√19","p":"cos120°=−1/2 なので余弦定理の最後の項は +24 になる(符号注意)。"},{"id":39,"f":"数学Ⅰ","u":"図形と計量","n":"内接円の半径(ヘロンの公式)","q":"△ABC で BC=13, CA=14, AB=15 のとき、面積 S と内接円の半径 r を求めよ。","i":"ヘロンの公式 S=√{s(s−a)(s−b)(s−c)}(s は周の半分)。S=1/2·r·(a+b+c) から r を求める。","s":"①s=(13+14+15)/2=21、S=√(21·8·7·6)=√7056=84\n②S=1/2·r·(13+14+15)=21r\n③r=84/21=4","a":"S=84, r=4","p":"内接円の公式は S=1/2·r·(三辺の和)。外接円の R の公式(R=abc/4S)と混同しない。"},{"id":40,"f":"数学Ⅰ","u":"図形と計量","n":"角の二等分線の長さ(面積の和で立式)","q":"△ABC で AB=3, AC=6, ∠A=60° とする。∠A の二等分線が辺 BC と交わる点を D とするとき、AD の長さを求めよ。","i":"△ABC=△ABD+△ACD と面積を2通りに表して AD の方程式を作る。(二等分線の定理 BD:DC=AB:AC も使える)","s":"①△ABC=1/2·3·6·sin60°=9√3/2\n②△ABD+△ACD=1/2·3·AD·sin30°+1/2·6·AD·sin30°=(9/4)AD\n③9√3/2=(9/4)AD → AD=2√3","a":"AD=2√3","p":"二等分された角は 30° ずつ。面積の式を立てると AD を直接求められる。"},{"id":41,"f":"数学Ⅰ","u":"図形と計量","n":"円に内接する四角形(余弦定理を2回)","q":"円に内接する四角形 ABCD で AB=1, BC=2, CD=3, DA=2 のとき、∠B, 対角線 AC の長さ、四角形 ABCD の面積を求めよ。","i":"内接四角形の対角の和は 180°(cosD=−cosB)。対角線 AC で2つの三角形に分け、余弦定理で AC² を2通りに表す。","s":"①△ABC: AC²=1+4−4cosB=5−4cosB\n②△ACD(∠D=180°−∠B): AC²=9+4−12cosD=13+12cosB\n③5−4cosB=13+12cosB → cosB=−1/2 → ∠B=120°\n④AC²=5+2=7 → AC=√7\n⑤面積=1/2·1·2·sin120°+1/2·3·2·sin60°=2√3","a":"∠B=120°, AC=√7, 面積 2√3","p":"∠D=180°−∠B より cosD=−cosB。どの対角線で分けるかを最初に決める。"},{"id":42,"f":"数学Ⅰ","u":"図形と計量","n":"測量(仰角と高さ)","q":"地点 A から塔の先端 P を見た仰角が 30°、A から塔に向かって 100m 進んだ地点 B から見た仰角が 60° であった。塔の高さを求めよ。(目の高さは無視する)","i":"塔の高さを h とおき、直角三角形で水平距離を h で表して、AB=100 の式を作る。","s":"①塔の足を Q とすると AQ=h/tan30°=√3h、BQ=h/tan60°=h/√3\n②AB=AQ−BQ=√3h−h/√3=2h/√3=100\n③h=50√3","a":"50√3 m (約 86.6 m)","p":"仰角は水平線からの角。水平距離は h÷tan(仰角) で表す。"},{"id":43,"f":"数学Ⅰ","u":"図形と計量","n":"空間図形(正四角錐の高さと体積)","q":"底面が1辺2の正方形で、側辺(頂点と底面の各頂点を結ぶ辺)の長さがすべて3の正四角錐の高さと体積を求めよ。","i":"頂点から底面におろした垂線の足は底面の中心。「対角線の半分」と側辺で直角三角形をつくり三平方の定理を使う。V=1/3×底面積×高さ。","s":"①底面の対角線は 2√2 → 中心から頂点までの距離は √2\n②高さ h=√(3²−(√2)²)=√7\n③V=1/3·2²·√7=4√7/3","a":"高さ √7、体積 4√7/3","p":"使うのは底面の「対角線の半分」(辺の半分ではない)。"},{"id":44,"f":"数学Ⅰ","u":"図形と計量","n":"体積を利用して点と平面の距離を求める","q":"四面体 OABC で ∠AOB=∠BOC=∠COA=90°, OA=OB=OC=2 のとき、頂点 O から △ABC に下ろした垂線の長さを求めよ。","i":"四面体の体積を2通りに表す。V=1/3×△OAB×OC=1/3×△ABC×h。","s":"①V=1/3·(1/2·2·2)·2=4/3\n②△ABC は1辺 2√2 の正三角形 → 面積=(√3/4)·8=2√3\n③V=1/3·2√3·h=4/3 → h=2/√3=2√3/3","a":"2√3/3","p":"「垂線の長さ=高さ h」とおいて体積の等式にする。直接垂線を作図しない。"},{"id":45,"f":"数学Ⅰ","u":"図形と計量","n":"鈍角三角形になる辺の長さの範囲","q":"3辺の長さが 3, 5, x の三角形が鈍角三角形になるような x の値の範囲を求めよ。","i":"①三角形の成立条件 |a−b|<c<a+b ②最大辺の2乗が他の2辺の2乗の和より大きい ⇔ 最大辺の対角が鈍角。最大辺がどれかで場合分けする。","s":"①成立条件: 2<x<8\n②x が最大辺(x≧5): x²>3²+5²=34 → x>√34\n③5 が最大辺(x≦5): 5²>3²+x² → x²<16 → x<4\n④2<x<4, または √34<x<8","a":"2<x<4, または √34<x<8","p":"まず成立条件。最大辺が 5 の場合と x の場合の両方を調べる。"},{"id":46,"f":"数学Ⅰ","u":"データの分析","n":"平均・分散・標準偏差","q":"5個のデータ 1, 2, 3, 4, 10 の平均、分散、標準偏差を求めよ。","i":"分散=(偏差²の平均)=(x²の平均)−(平均)²。標準偏差=√分散。","s":"①平均=(1+2+3+4+10)/5=4\n②x²の平均=(1+4+9+16+100)/5=26\n③分散=26−4²=10\n④標準偏差=√10","a":"平均 4、分散 10、標準偏差 √10","p":"分散は個数 n で割る(n−1 ではない)。"},{"id":47,"f":"数学Ⅰ","u":"データの分析","n":"変量の変換(y=ax+b)","q":"変量 x の平均が 20、分散が 9 であるとき、y=−2x+5 の平均、分散、標準偏差を求めよ。","i":"y=ax+b のとき、平均は a·x̄+b、分散は a²·s²、標準偏差は |a|·s。","s":"①平均=−2·20+5=−35\n②分散=(−2)²·9=36\n③標準偏差=√36=6 (=|−2|×3)","a":"平均 −35、分散 36、標準偏差 6","p":"a が負でも分散は a² 倍(正)、標準偏差は |a| 倍。b は分散に影響しない。"},{"id":48,"f":"数学Ⅰ","u":"データの分析","n":"相関係数の計算","q":"2変量のデータ x: 2, 4, 6 と y: 1, 3, 2 について、相関係数を求めよ。","i":"相関係数 r=(共分散)÷(xの標準偏差×yの標準偏差)。共分散=(偏差の積の平均)。","s":"①x̄=4, ȳ=2。偏差は x: −2, 0, 2 / y: −1, 1, 0\n②共分散=(2+0+0)/3=2/3\n③s_x²=8/3, s_y²=2/3\n④r=(2/3)/√(8/3·2/3)=(2/3)/(4/3)=1/2","a":"1/2","p":"相関係数は −1≦r≦1。分母は標準偏差の積(分散の積ではない)。"},{"id":49,"f":"数学Ⅰ","u":"データの分析","n":"四分位数と四分位範囲","q":"データ 1, 3, 4, 6, 7, 9, 10, 12 の第1・第2・第3四分位数と四分位範囲を求めよ。","i":"小さい順に並べ、中央値(Q2)で下位・上位に分ける(個数が奇数なら中央値は除く)。それぞれの中央値が Q1, Q3。","s":"①Q2=(6+7)/2=6.5\n②下位 1, 3, 4, 6 の中央値 Q1=(3+4)/2=3.5\n③上位 7, 9, 10, 12 の中央値 Q3=(9+10)/2=9.5\n④四分位範囲=Q3−Q1=6","a":"Q1=3.5, Q2=6.5, Q3=9.5, 四分位範囲 6","p":"データの個数が奇数のときは、中央値を含めずに半分に分ける。"},{"id":50,"f":"数学Ⅰ","u":"データの分析","n":"分散の公式(2乗の平均−平均の2乗)","q":"変量 x の2乗の平均が 34、x の平均が 5 であるとき、x の分散と標準偏差を求めよ。","i":"分散=(x²の平均)−(xの平均)²。","s":"①分散=34−5²=9\n②標準偏差=√9=3","a":"分散 9、標準偏差 3","p":"「2乗の平均」と「平均の2乗」を混同しない。"},{"id":51,"f":"数学Ⅰ","u":"データの分析","n":"2グループを合わせた平均","q":"A組20人の平均点が60点、B組30人の平均点が70点であるとき、50人全体の平均点を求めよ。","i":"全体の平均=(各組の合計点の和)÷(全体の人数)。「平均×人数=合計」で考える。","s":"①A組の合計=20×60=1200\n②B組の合計=30×70=2100\n③全体の平均=(1200+2100)/50=66","a":"66点","p":"2つの平均を単純に平均(65点)してはいけない。人数で重みをつける。"},{"id":52,"f":"数学A","u":"場合の数と確率","n":"約数の個数と総和","q":"360 の正の約数の個数と、正の約数の総和を求めよ。","i":"素因数分解 N=p^a·q^b·r^c から、個数=(a+1)(b+1)(c+1)、総和=(1+p+…+p^a)(1+q+…+q^b)(1+r+…+r^c)。","s":"①360=2³·3²·5\n②個数=(3+1)(2+1)(1+1)=24\n③総和=(1+2+4+8)(1+3+9)(1+5)=15·13·6=1170","a":"個数 24、総和 1170","p":"個数は「指数+1」の積。総和は各素数ごとのかっこの積。"},{"id":53,"f":"数学A","u":"場合の数と確率","n":"順列(隣り合う並べ方)","q":"男子3人と女子4人が1列に並ぶとき、男子3人が隣り合う並び方は何通りあるか。","i":"隣り合うものを1つのかたまり(ブロック)とみなして並べ、ブロック内の並べ方をかける。","s":"①男子3人を1ブロックとみなす → ブロックと女子4人の5つを並べる 5!=120\n②ブロック内の男子の並び方 3!=6\n③120×6=720","a":"720通り","p":"ブロック内の並べ方(3!)をかけ忘れる。"},{"id":54,"f":"数学A","u":"場合の数と確率","n":"順列(隣り合わない並べ方)","q":"男子3人と女子4人が1列に並ぶとき、男子どうしが隣り合わない並び方は何通りあるか。","i":"隣り合わせたくないものは「あとから間に入れる」。先に他のもの(女子)を並べ、その間と両端に男子を入れる。","s":"①女子4人を並べる 4!=24\n②女子の間と両端の5か所から3か所を選んで男子を並べる P(5,3)=60\n③24×60=1440","a":"1440通り","p":"入れる場所は両端を含めて「人数+1」か所。"},{"id":55,"f":"数学A","u":"場合の数と確率","n":"同じものを含む順列","q":"SUCCESS の7文字を並べかえてできる文字列は何通りあるか。","i":"同じものを含む順列は、すべて区別して並べた数を同じもの同士の並べ方で割る。n!/(p!q!r!)。","s":"①S が3個、C が2個、U と E が1個ずつ\n②7!/(3!·2!)=5040/12=420","a":"420通り","p":"同じ文字の個数の階乗で割る。"},{"id":56,"f":"数学A","u":"場合の数と確率","n":"円順列","q":"6人が円形のテーブルに座るとき、(1)座り方は何通りか (2)特定の2人 A, B が隣り合う座り方は何通りか。","i":"円順列は回転して重なるものを同じとみて (n−1)!。隣り合う2人はブロックとして扱い、ブロック内の並べ方(2!)をかける。","s":"①(1) (6−1)!=120\n②(2) A, B を1ブロックとみなすと5つの円順列 (5−1)!=24\n③ブロック内の並べ方 2! をかけて 24×2=48","a":"(1)120通り (2)48通り","p":"円順列は n! ではなく (n−1)!。"},{"id":57,"f":"数学A","u":"場合の数と確率","n":"組合せ(ちょうど1人を含む選び方)","q":"10人から4人を選ぶとき、特定の2人 A, B のうち、ちょうど1人だけが選ばれる選び方は何通りか。","i":"「ちょうど1人」を A だけの場合と B だけの場合に分け(和の法則)、残りの人から必要な人数を選ぶ。","s":"①A が入り B が入らない: 残り8人から3人を選ぶ C(8,3)=56\n②B が入り A が入らない: 同様に 56\n③56+56=112","a":"112通り","p":"A だけ・B だけの2通りを足す(2倍する)のを忘れない。"},{"id":58,"f":"数学A","u":"場合の数と確率","n":"組分け(区別のある・なし)","q":"6人を (1)2人ずつ3つの組に分ける (2)A, B, C の3つの部屋に2人ずつ入れる とき、分け方はそれぞれ何通りか。","i":"組に区別がなければ、区別がある場合の数を、同じ人数の組の入れ替え(3!)で割る。","s":"①(2)区別あり: C(6,2)·C(4,2)·C(2,2)=15·6·1=90\n②(1)区別なし: 3組の入れ替え 3!=6 で割る → 90÷6=15","a":"(1)15通り (2)90通り","p":"同じ人数の組が複数あるとき、組の区別の有無で割るかどうかが決まる。"},{"id":59,"f":"数学A","u":"場合の数と確率","n":"方程式の整数解の個数(○と仕切り)","q":"x+y+z=6 を満たす0以上の整数の組 (x,y,z) は何組あるか。","i":"6個の○を2本の仕切り「|」で3つに分ける並べ方と考え、同じものを含む順列 8!/(6!2!)=C(8,2) で求める。","s":"①○6個と仕切り2本を1列に並べる(全部で8個)\n②仕切りの位置を2か所選ぶ C(8,2)=28","a":"28組","p":"「正の整数」のときは先に各文字に1ずつ配ってから考える(x'+y'+z'=3 → C(5,2)=10)。"},{"id":60,"f":"数学A","u":"場合の数と確率","n":"最短経路の数","q":"右または上にだけ進めるとき、A(0,0) から B(4,3) まで最短で行く経路は何通りか。また、点 P(2,1) を通る経路、P を通らない経路はそれぞれ何通りか。","i":"右へ4回・上へ3回の並べ方 C(7,3)。途中の点を通るときは A→P と P→B に分けて積の法則。通らない場合は全体から引く。","s":"①全体: 右4・上3の並べ方 C(7,3)=35\n②A→P(右2・上1): C(3,1)=3、P→B(右2・上2): C(4,2)=6 → 3×6=18\n③通らない: 35−18=17","a":"全体 35通り、P を通る 18通り、P を通らない 17通り","p":"「通る」は積、「通らない」は全体から引く(余事象)。"},{"id":61,"f":"数学A","u":"場合の数と確率","n":"整数の個数(0を含む・偶数)","q":"0, 1, 2, 3, 4 の5個の数字から異なる3個を使って3桁の整数を作る。(1)整数は全部で何個か (2)偶数は何個か。","i":"先頭(百の位)に 0 は使えない。偶数は一の位で場合分け(0 の場合と 2, 4 の場合)。","s":"①(1) 百の位4通り、十の位4通り、一の位3通り → 4·4·3=48\n②(2)一の位が 0: 4·3=12\n③一の位が 2 または 4(2通り): 百の位は 0 と使った数を除く3通り、十の位は残り3通り → 2·3·3=18\n④12+18=30","a":"(1)48個 (2)30個","p":"一の位が 0 のときと 0 でないときで、百の位の選び方の数が変わる。"},{"id":62,"f":"数学A","u":"場合の数と確率","n":"確率の基本(さいころ2個)","q":"大小2個のさいころを投げるとき、目の和が5の倍数になる確率を求めよ。","i":"全事象は 6×6=36 通り。条件に合う場合を表にして漏れなく数える。","s":"①和が5: (1,4),(2,3),(3,2),(4,1) の4通り\n②和が10: (4,6),(5,5),(6,4) の3通り\n③4+3=7通り → 7/36","a":"7/36","p":"大小の区別があるので (1,4) と (4,1) は別の場合。"},{"id":63,"f":"数学A","u":"場合の数と確率","n":"余事象の確率(少なくとも1つ)","q":"4個のさいころを同時に投げるとき、少なくとも1個は1の目が出る確率を求めよ。","i":"「少なくとも1つ」は余事象「1つも〜でない」の確率を 1 から引く。","s":"①余事象は「4個とも1以外」: (5/6)⁴=625/1296\n②求める確率=1−625/1296=671/1296","a":"671/1296","p":"余事象の確率を求めたあと、1 から引くのを忘れない。"},{"id":64,"f":"数学A","u":"場合の数と確率","n":"反復試行の確率","q":"1個のさいころを5回投げるとき、3の倍数の目がちょうど2回出る確率を求めよ。","i":"1回の試行で起こる確率が p のとき、n 回中ちょうど r 回起こる確率は C(n,r)·p^r·(1−p)^(n−r)。","s":"①3の倍数(3, 6)が出る確率 p=1/3\n②C(5,2)·(1/3)²·(2/3)³=10·(1/9)·(8/27)\n③=80/243","a":"80/243","p":"C(n,r)(どの回に起こるかの選び方)をかけ忘れる。"},{"id":65,"f":"数学A","u":"場合の数と確率","n":"先に○勝した方が勝つ確率","q":"AとBが試合をする。1回の試合で A が勝つ確率は 2/3、B が勝つ確率は 1/3 で、引き分けはない。先に3勝した方を優勝とするとき、A が優勝する確率を求めよ。","i":"優勝が決まる試合数(3回・4回・5回)で場合分けする。最後の試合は必ず優勝者が勝つ。","s":"①3勝0敗: (2/3)³=24/81\n②3勝1敗(4試合目で A が3勝目): C(3,2)(2/3)²(1/3)·(2/3)=24/81\n③3勝2敗(5試合目で A が3勝目): C(4,2)(2/3)²(1/3)²·(2/3)=16/81\n④24/81+24/81+16/81=64/81","a":"64/81","p":"最後の試合は A が勝つと決まっているので、C は「最後の試合を除いた回数」から選ぶ。"},{"id":66,"f":"数学A","u":"場合の数と確率","n":"条件付き確率","q":"白玉3個、赤玉2個の入った袋から、玉を1個ずつ続けて2個取り出す(取り出した玉は戻さない)。2個目が赤玉であったとき、1個目も赤玉である確率を求めよ。","i":"条件付き確率 P_A(B)=P(A∩B)/P(A)。A=「2個目が赤」、B=「1個目が赤」。","s":"①P(A∩B)=2/5·1/4=1/10\n②P(A)=(赤→赤)1/10+(白→赤)3/5·2/4=1/10+3/10=2/5\n③P_A(B)=(1/10)/(2/5)=1/4","a":"1/4","p":"「〜であったとき」は、分母が「条件となる事象の確率」。分母と分子を逆にしない。"},{"id":67,"f":"数学A","u":"場合の数と確率","n":"期待値(同時に取り出す)","q":"赤玉3個、白玉2個が入った袋から同時に2個取り出すとき、取り出した赤玉の個数の期待値を求めよ。","i":"確率変数の値ごとに確率を求め、期待値 E=Σ(値×確率)を計算する。確率の和が1か確認する。","s":"①赤0個: C(2,2)/C(5,2)=1/10\n②赤1個: C(3,1)·C(2,1)/C(5,2)=6/10\n③赤2個: C(3,2)/C(5,2)=3/10\n④E=0·(1/10)+1·(6/10)+2·(3/10)=12/10=6/5","a":"6/5","p":"確率の合計が 1(1/10+6/10+3/10)になるか必ず検算する。"},{"id":68,"f":"数学A","u":"場合の数と確率","n":"くじ引きの確率(順番によらない)","q":"当たり2本、はずれ3本の5本のくじを、A さん、B さんの順に1本ずつ引く(引いたくじは戻さない)。B さんが当たる確率を求めよ。","i":"A さんの結果で場合分けして和をとる。結果的にくじ引きは、引く順番に関係なく当たる確率は同じ(2/5)になる。","s":"①A 当たり・B 当たり: 2/5·1/4=1/10\n②A はずれ・B 当たり: 3/5·2/4=3/10\n③1/10+3/10=2/5","a":"2/5","p":"「後に引くと不利」にはならない。どの順番でも確率は等しい。"},{"id":69,"f":"数学A","u":"場合の数と確率","n":"独立な試行と余事象","q":"A さんが的に当てる確率は 2/3、B さんが当てる確率は 3/4 である。2人が1回ずつ射るとき、少なくとも1人が当てる確率を求めよ。","i":"独立な試行の確率は積。「少なくとも1人」は余事象「2人とも外れる」を 1 から引く。","s":"①2人とも外れる確率=(1−2/3)(1−3/4)=1/3·1/4=1/12\n②1−1/12=11/12","a":"11/12","p":"独立な試行は積(足し算にしない)。"},{"id":70,"f":"数学A","u":"場合の数と確率","n":"最大値・最小値に関する確率","q":"3個のさいころを同時に投げるとき、出た目の最大値がちょうど4になる確率を求めよ。","i":"「最大値がちょうど k」=(最大値が k 以下)−(最大値が k−1 以下)。「k 以下」は3個とも k 以下なので k³ 通り。","s":"①最大値が4以下: 4³=64通り\n②最大値が3以下: 3³=27通り\n③64−27=37通り → 37/216","a":"37/216","p":"「ちょうど」は「以下」の差で求める。最小値なら「以上」の差。"},{"id":71,"f":"数学A","u":"場合の数と確率","n":"じゃんけんの確率","q":"3人が1回じゃんけんをするとき、(1)ちょうど1人だけが勝つ確率 (2)あいこになる確率 を求めよ。","i":"手の出し方は全部で 3³=27通り。「勝つ人の選び方×勝つ手」で数える。3人のあいこは「全員同じ」と「全員違う」。","s":"①(1)勝つ1人の選び方3通り×勝つ手3通り=9通り → 9/27=1/3\n②(2)全員同じ手: 3通り、3人とも違う手: 3!=6通り → 9通り → 1/3","a":"(1)1/3 (2)1/3","p":"3人のあいこは2タイプある(全員同じ/全員違う)。"},{"id":72,"f":"数学A","u":"整数の性質","n":"平方数になる条件(素因数分解)","q":"(1)√(180n) が自然数となる最小の自然数 n を求めよ。 (2)√(180/n) が自然数となる自然数 n をすべて求めよ。","i":"素因数分解して、平方数になる条件(各素数の指数がすべて偶数)を考える。","s":"①180=2²·3²·5\n②(1)指数が奇数の 5 を偶数にするため、最小の n=5\n③(2)180/n が平方数 → 平方数である 180 の約数 1, 4, 9, 36 を 180 で割る → n=180, 45, 20, 5","a":"(1)n=5 (2)n=5, 20, 45, 180","p":"(2)は 180/n が「自然数かつ平方数」。n が 180 の約数であることを確認する。"},{"id":73,"f":"数学A","u":"整数の性質","n":"互除法による最大公約数","q":"391 と 299 の最大公約数を、互除法を用いて求めよ。","i":"a=bq+r のとき gcd(a,b)=gcd(b,r)。余りが 0 になるまで割り算を繰り返す。","s":"①391=299·1+92\n②299=92·3+23\n③92=23·4+0 → 最後に割り切れたときの割る数 23","a":"23","p":"答えは「余りが 0 になる直前の割る数」。"},{"id":74,"f":"数学A","u":"整数の性質","n":"最大公約数・最小公倍数から2数を求める","q":"2つの自然数 a, b (a<b) の最大公約数が 6、最小公倍数が 180 であるとき、a, b の組をすべて求めよ。","i":"a=6x, b=6y (x, y は互いに素)とおくと、最小公倍数は 6xy。互いに素な (x,y) の組を調べる。","s":"①a=6x, b=6y (x<y、x と y は互いに素)\n②最小公倍数=6xy=180 → xy=30\n③互いに素な組: (1,30), (2,15), (3,10), (5,6)\n④(a,b)=(6,180), (12,90), (18,60), (30,36)","a":"(a,b)=(6,180), (12,90), (18,60), (30,36)","p":"x と y が互いに素であることを条件に入れる。積 ab=(最大公約数)×(最小公倍数) も確認に使える。"},{"id":75,"f":"数学A","u":"整数の性質","n":"連続整数の積と倍数の証明","q":"n が整数のとき、n³−n は6の倍数であることを証明せよ。","i":"n³−n=(n−1)n(n+1) は連続する3整数の積。連続3整数には2の倍数と3の倍数が含まれる。","s":"①n³−n=(n−1)n(n+1)\n②連続する3整数のうち少なくとも1つは2の倍数、ちょうど1つは3の倍数\n③2と3は互いに素なので、積は6の倍数","a":"(証明)連続3整数の積 (n−1)n(n+1) は2の倍数かつ3の倍数であり、2と3は互いに素なので6の倍数。","p":"「2の倍数かつ3の倍数 ⇒ 6の倍数」は2と3が互いに素だから成り立つ、と書く。"},{"id":76,"f":"数学A","u":"整数の性質","n":"余りによる場合分けの証明","q":"整数 x, y について、x²+y² が3の倍数ならば、x, y はともに3の倍数であることを証明せよ。","i":"整数を3で割った余り(0, 1, 2)で分類し、2乗を3で割った余りを調べる(n² を3で割った余りは 0 か 1)。","s":"①n=3k, 3k+1, 3k+2 のとき n² を3で割った余りは 0, 1, 1\n②x², y² の余りの組 (0,0)→和の余り0、(0,1),(1,0)→1、(1,1)→2\n③和が3の倍数になるのは両方の余りが 0 のときだけ → x, y ともに3の倍数","a":"(証明)2乗を3で割った余りは 0 か 1 で、和が3の倍数になるのは両方 0 のときだけ。","p":"余りの組合せをすべて書き出して、漏れなく調べる。"},{"id":77,"f":"数学A","u":"整数の性質","n":"1次不定方程式の整数解","q":"5x+7y=1 のすべての整数解 (x, y) を求めよ。","i":"まず特殊解を1組見つけ、もとの式との差をとって「互いに素」の性質から一般解を導く。","s":"①特殊解: (x,y)=(3,−2)(5·3+7·(−2)=1)\n②辺々引く: 5(x−3)+7(y+2)=0 → 5(x−3)=−7(y+2)\n③5と7は互いに素なので x−3=7k, y+2=−5k (k は整数)\n④x=7k+3, y=−5k−2","a":"(x,y)=(7k+3, −5k−2) (k は整数)","p":"「5と7は互いに素」を根拠として書く。特殊解は係数をよく観察して見つける。"},{"id":78,"f":"数学A","u":"整数の性質","n":"積の形に変形する不定方程式","q":"xy−2x−3y=0 を満たす自然数 (x,y) の組をすべて求めよ。","i":"(x−3)(y−2)=6 のように「(式)(式)=整数」の形に変形し、積が6になる整数の組を調べて、条件に合うものを選ぶ。","s":"①xy−2x−3y=(x−3)(y−2)−6 より (x−3)(y−2)=6\n②(x−3, y−2) は積が6の整数の組。負の組は y が自然数にならない(例: (−1,−6) → y=−4)\n③(x−3, y−2)=(1,6), (2,3), (3,2), (6,1)\n④(x,y)=(4,8), (5,5), (6,4), (9,3)","a":"(x,y)=(4,8), (5,5), (6,4), (9,3)","p":"負の約数の組も検討して、「自然数」の条件で除外する。"},{"id":79,"f":"数学A","u":"整数の性質","n":"n進法","q":"(1)10進数の100を3進法で表せ。 (2)2進数 101101₍₂₎ を10進法で表せ。","i":"10進→n進は n で割り続けて余りを逆順に並べる。n進→10進は各位に n の累乗をかけて足す。","s":"①100÷3=33余り1、33÷3=11余り0、11÷3=3余り2、3÷3=1余り0、1÷3=0余り1\n②余りを下から並べて 10201₍₃₎\n③(2) 1·2⁵+0·2⁴+1·2³+1·2²+0·2+1=32+8+4+1=45","a":"(1)10201₍₃₎ (2)45","p":"余りは「最後に出たものから」順に並べる。"},{"id":80,"f":"数学A","u":"整数の性質","n":"累乗の余り(周期性)","q":"2¹⁰⁰ を7で割った余りを求めよ。","i":"累乗の余りは周期がある。2³=8≡1 (mod 7) のように、余りが1になるところを見つけて指数を周期で割る。","s":"①2³=8=7·1+1 より 2³≡1 (mod 7)\n②100=3·33+1\n③2¹⁰⁰=(2³)³³·2≡1³³·2=2 (mod 7)","a":"2","p":"周期(ここでは3)で割った余りに注意。2の累乗の余りは 2, 4, 1 の繰り返し。"},{"id":81,"f":"数学A","u":"整数の性質","n":"分数式が整数になる条件","q":"(n+7)/(n+1) が整数となるような自然数 n をすべて求めよ。","i":"分子を分母の倍数+定数の形に直し、(定数)/(n+1) が整数 ⇒ n+1 が定数の約数、と考える。","s":"①(n+7)/(n+1)=1+6/(n+1)\n②6/(n+1) が整数 → n+1 は6の約数\n③n は自然数なので n+1≧2 → n+1=2, 3, 6\n④n=1, 2, 5","a":"n=1, 2, 5","p":"n の範囲(n+1≧2)から、約数のうち合うものだけを採用する。"},{"id":82,"f":"数学A","u":"図形の性質","n":"三角形の重心・外心・内心","q":"△ABC について、(1)重心を G、辺 BC の中点を M とする。中線 AM=9 のとき AG を求めよ。 (2)∠A=50° のとき、外心を O とすると ∠BOC は何度か。 (3)∠A=60° のとき、内心を I とすると ∠BIC は何度か。","i":"重心は中線を 2:1 に内分する。外心は円周角の定理から ∠BOC=2∠A。内心は ∠IBC+∠ICB=(∠B+∠C)/2 を使う。","s":"①(1)AG:GM=2:1 → AG=9×2/3=6\n②(2)中心角は円周角の2倍 → ∠BOC=2×50°=100°\n③(3)∠IBC+∠ICB=(180°−60°)/2=60° → ∠BIC=180°−60°=120°","a":"(1)AG=6 (2)100° (3)120°","p":"重心は頂点側が 2、辺側が 1。外心は「2倍」、内心は「半分」の関係。"},{"id":83,"f":"数学A","u":"図形の性質","n":"チェバの定理","q":"△ABC の辺 BC, CA, AB 上にそれぞれ点 D, E, F があり、3直線 AD, BE, CF が1点で交わっている。AF:FB=1:2, BD:DC=3:1 のとき、CE:EA を求めよ。","i":"3直線が1点で交わるとき、チェバの定理 (AF/FB)·(BD/DC)·(CE/EA)=1 が成り立つ。","s":"①(AF/FB)(BD/DC)(CE/EA)=1\n②(1/2)·(3/1)·(CE/EA)=1\n③CE/EA=2/3 → CE:EA=2:3","a":"CE:EA=2:3","p":"A→F→B→D→C→E→A と三角形を一周する向きで掛ける。分子・分母の向きに注意。"},{"id":84,"f":"数学A","u":"図形の性質","n":"メネラウスの定理","q":"△ABC で、辺 BC を 1:2 に内分する点を D、辺 CA の中点を E とし、AD と BE の交点を P とする。BP:PE を求めよ。","i":"三角形と、頂点を通らない1直線に対してメネラウスの定理 (BD/DC)(CA/AE)(EP/PB)=1 を用いる。適用する三角形を明記する。","s":"①△BCE と直線 APD にメネラウスの定理を適用\n②(BD/DC)·(CA/AE)·(EP/PB)=1\n③(1/2)·(2/1)·(EP/PB)=1 (E は CA の中点なので CA/AE=2)\n④EP/PB=1 → BP:PE=1:1","a":"BP:PE=1:1","p":"どの三角形にどの直線を当てるかを決めてから立式する。"},{"id":85,"f":"数学A","u":"図形の性質","n":"方べきの定理","q":"円の外部の点 P から、円と2点 A, B で交わる直線と、円に接する直線を引く。接点を T とし、PA=3, AB=5 のとき、PT の長さを求めよ。","i":"方べきの定理: 円外の点 P を通る直線が円と A, B で交わるとき、PA·PB=PT²(PT は接線の長さ)。","s":"①PB=PA+AB=3+5=8\n②PT²=PA·PB=3·8=24\n③PT=2√6","a":"PT=2√6","p":"かけるのは PA×PB(全体)。PA×AB ではない。"},{"id":86,"f":"数学A","u":"図形の性質","n":"円周角の定理と内接四角形","q":"円に内接する四角形 ABCD で ∠ABC=80°, ∠BAC=40° のとき、∠ADB と ∠ADC を求めよ。","i":"同じ弧に対する円周角は等しい。内接四角形の対角の和は 180°。","s":"①△ABC で ∠ACB=180°−80°−40°=60°\n②∠ADB=∠ACB=60°(弧 AB に対する円周角)\n③∠ADC=180°−∠ABC=100°(内接四角形の対角)","a":"∠ADB=60°, ∠ADC=100°","p":"「同じ弧に対する円周角」を見つける。どの弧に立つ角かを確認する。"},{"id":87,"f":"数学A","u":"図形の性質","n":"接弦定理","q":"円 O に内接する △ABC があり、点 A における円の接線上に、B 側に点 T をとる。∠TAB=50°, ∠ABC=70° のとき、∠BAC を求めよ。","i":"接線と弦がつくる角は、その角の内部にある弧に対する円周角に等しい(接弦定理)。∠TAB=∠ACB。","s":"①接弦定理より ∠ACB=∠TAB=50°\n②△ABC の内角の和から ∠BAC=180°−70°−50°=60°","a":"∠BAC=60°","p":"∠TAB と等しいのは、弧 AB に対する反対側の円周角 ∠ACB。"},{"id":88,"f":"数学A","u":"図形の性質","n":"内接円と接線の長さ","q":"△ABC の内接円が辺 BC, CA, AB と接する点を、それぞれ D, E, F とする。AB=7, BC=8, CA=5 のとき、AF, BD, CE の長さを求めよ。","i":"円外の1点から引いた2本の接線の長さは等しい(AF=AE, BF=BD, CD=CE)。3つの未知数の連立方程式にする。","s":"①AF=AE=x, BF=BD=y, CD=CE=z とおく\n②x+y=7, y+z=8, z+x=5\n③辺々加えて x+y+z=10 → z=3, x=2, y=5","a":"AF=2, BD=5, CE=3","p":"x+y+z=(周の長さ)/2 を使うと速い。"},{"id":89,"f":"数学A","u":"図形の性質","n":"相似と面積比","q":"△ABC で、辺 AB, AC 上に点 D, E をとると DE∥BC となり、AD:DB=2:3 である。△ADE と台形 DBCE の面積比を求めよ。","i":"相似比が a:b のとき、面積比は a²:b²。台形の面積=(大きい三角形)−(小さい三角形)。","s":"①AD:AB=2:5 → △ADE:△ABC=2²:5²=4:25\n②台形 DBCE=25−4=21\n③△ADE:台形 DBCE=4:21","a":"4:21","p":"相似比は AD:AB=2:5(AD:DB=2:3 ではない)。面積比は相似比の2乗。"},{"id":90,"f":"数学Ⅱ","u":"式と証明・複素数と方程式","n":"二項定理(特定の項の係数)","q":"(2x−3y)⁵ の展開式における x²y³ の係数を求めよ。","i":"二項定理 (a+b)ⁿ=ΣC(n,k)·aⁿ⁻ᵏ·bᵏ の一般項から、目的の項になる k を決める。","s":"①一般項は C(5,k)(2x)⁵⁻ᵏ(−3y)ᵏ\n②x²y³ となるのは k=3\n③C(5,3)·2²·(−3)³=10·4·(−27)=−1080","a":"−1080","p":"係数の 2 や −3 の累乗(符号も含む)を忘れない。"},{"id":91,"f":"数学Ⅱ","u":"式と証明・複素数と方程式","n":"二項定理(定数項)","q":"(x²+1/x)⁶ の展開式の定数項を求めよ。","i":"一般項を x のべきの形に整理し、指数が 0 になる k を求める。","s":"①一般項は C(6,k)(x²)⁶⁻ᵏ(1/x)ᵏ=C(6,k)·x¹²⁻³ᵏ\n②定数項 → 12−3k=0 → k=4\n③C(6,4)=15","a":"15","p":"1/x=x⁻¹ として指数を計算する。"},{"id":92,"f":"数学Ⅱ","u":"式と証明・複素数と方程式","n":"恒等式の係数決定","q":"等式 a(x−1)²+b(x−1)+c=2x²−3x+5 が x についての恒等式となるように、定数 a, b, c の値を求めよ。","i":"恒等式は、両辺を展開して各次数の係数を比べる(係数比較法)か、適当な値を代入する(数値代入法)で解く。","s":"①左辺=ax²+(−2a+b)x+(a−b+c)\n②係数比較: a=2, −2a+b=−3, a−b+c=5\n③a=2, b=1, c=4","a":"a=2, b=1, c=4","p":"数値代入法は必要条件にすぎない。係数比較の方が確実。"},{"id":93,"f":"数学Ⅱ","u":"式と証明・複素数と方程式","n":"部分分数分解(恒等式)","q":"1/{(x−1)(x+2)} = a/(x−1) + b/(x+2) が x についての恒等式となるように、定数 a, b の値を求めよ。","i":"両辺に分母 (x−1)(x+2) をかけて整式の恒等式にし、数値代入か係数比較で a, b を決める。","s":"①両辺に (x−1)(x+2) をかけて 1=a(x+2)+b(x−1)\n②x=1 を代入 → 1=3a → a=1/3\n③x=−2 を代入 → 1=−3b → b=−1/3","a":"a=1/3, b=−1/3","p":"整式の恒等式になるので x=1, −2 を代入してよい。数列の和(部分分数の差の形)の基礎になる。"},{"id":94,"f":"数学Ⅱ","u":"式と証明・複素数と方程式","n":"相加平均・相乗平均の関係(基本)","q":"x>0 のとき、x+9/x の最小値を求めよ。","i":"a>0, b>0 のとき a+b≧2√(ab)。等号成立は a=b のとき。","s":"①x>0, 9/x>0 より x+9/x≧2√(x·9/x)=6\n②等号は x=9/x → x=3(x>0)のとき成り立つ\n③最小値 6","a":"最小値 6(x=3 のとき)","p":"正の数であること、等号が成り立つ x が実際にあることを確認する。"},{"id":95,"f":"数学Ⅱ","u":"式と証明・複素数と方程式","n":"相加平均・相乗平均の関係(条件つき)","q":"x>0, y>0, 1/x+4/y=1 のとき、x+y の最小値を求めよ。","i":"条件式の右辺の「1」を x+y にかけた (x+y)(1/x+4/y) を展開し、相加・相乗平均の関係を使う。","s":"①x+y=(x+y)(1/x+4/y)=5+y/x+4x/y\n②y/x>0, 4x/y>0 より ≧5+2√4=9\n③等号は y/x=4x/y → y=2x。条件式に代入して 1/x+2/x=1 → x=3, y=6\n④最小値 9","a":"最小値 9(x=3, y=6 のとき)","p":"等号が成り立つ (x,y) が条件式をみたすことを確認する。"},{"id":96,"f":"数学Ⅱ","u":"式と証明・複素数と方程式","n":"不等式の証明(平方の和)","q":"a, b, c が実数のとき、a²+b²+c²≧ab+bc+ca を証明せよ。また、等号が成り立つ条件を答えよ。","i":"(左辺)−(右辺) を作り、(実数)²の和の形に変形して 0 以上であることを示す。","s":"①左辺−右辺=a²+b²+c²−ab−bc−ca=(1/2){(a−b)²+(b−c)²+(c−a)²}\n②実数の2乗の和は 0 以上なので 左辺≧右辺\n③等号は a−b=b−c=c−a=0、すなわち a=b=c のとき","a":"(証明)左辺−右辺=(1/2){(a−b)²+(b−c)²+(c−a)²}≧0。等号は a=b=c のとき。","p":"等号成立条件まで書く。「差をとる」が証明の基本。"},{"id":97,"f":"数学Ⅱ","u":"式と証明・複素数と方程式","n":"複素数の計算(除法)","q":"(2+i)/(1−i) を a+bi の形で表せ。","i":"分母の共役複素数(1+i)を分母・分子にかけて、分母を実数にする。i²=−1。","s":"①(2+i)(1+i)/{(1−i)(1+i)}\n②分子=2+2i+i+i²=1+3i、分母=1−i²=2\n③(1+3i)/2","a":"(1+3i)/2(=1/2+(3/2)i)","p":"i²=−1 を代入するのを忘れない。"},{"id":98,"f":"数学Ⅱ","u":"式と証明・複素数と方程式","n":"複素数の相等","q":"x, y が実数のとき、(x+yi)(1+i)=3+i を満たす x, y の値を求めよ。","i":"左辺を展開して a+bi の形にし、実部どうし・虚部どうしを等しいとおく(a, b, c, d が実数のとき a+bi=c+di ⇔ a=c かつ b=d)。","s":"①左辺=x+xi+yi+yi²=(x−y)+(x+y)i\n②実部: x−y=3、虚部: x+y=1\n③x=2, y=−1","a":"x=2, y=−1","p":"x, y が実数であることが、実部・虚部を比べる前提。"},{"id":99,"f":"数学Ⅱ","u":"式と証明・複素数と方程式","n":"解と係数の関係(対称式の値)","q":"2次方程式 x²−3x+5=0 の2つの解を α, β とするとき、α²+β² と 1/α+1/β の値を求めよ。","i":"解と係数の関係: α+β=−b/a, αβ=c/a。対称式は α+β と αβ で表す。","s":"①α+β=3, αβ=5\n②α²+β²=(α+β)²−2αβ=9−10=−1\n③1/α+1/β=(α+β)/(αβ)=3/5","a":"α²+β²=−1, 1/α+1/β=3/5","p":"解が虚数でも解と係数の関係は使える。解そのものを求めない。"},{"id":100,"f":"数学Ⅱ","u":"式と証明・複素数と方程式","n":"2数を解とする2次方程式","q":"2次方程式 x²−2x+4=0 の2つの解を α, β とするとき、α+2, β+2 を解とする2次方程式を1つ作れ。","i":"新しい2解の和と積を α+β, αβ で計算し、x²−(和)x+(積)=0 とする。","s":"①α+β=2, αβ=4\n②和=(α+2)+(β+2)=α+β+4=6\n③積=(α+2)(β+2)=αβ+2(α+β)+4=12\n④x²−6x+12=0","a":"x²−6x+12=0","p":"x²−(和)x+(積)=0 の符号に注意。"},{"id":101,"f":"数学Ⅱ","u":"式と証明・複素数と方程式","n":"因数定理と3次方程式","q":"整式 P(x)=x³+ax²−x+6 が x−2 で割り切れるとき、定数 a の値を求め、方程式 P(x)=0 を解け。","i":"P(x) が x−k で割り切れる ⇔ P(k)=0(因数定理)。因数を取り出して残りの2次式を解く。","s":"①P(2)=8+4a−2+6=0 → a=−3\n②P(x)=x³−3x²−x+6=(x−2)(x²−x−3)\n③x=2 または x²−x−3=0 → x=(1±√13)/2","a":"a=−3、x=2, (1±√13)/2","p":"組立除法で商を求めてから、残りの2次式を解の公式で解く。"},{"id":102,"f":"数学Ⅱ","u":"式と証明・複素数と方程式","n":"剰余の定理(2次式で割った余り)","q":"整式 P(x) を x−1 で割ると余りが 3、x+2 で割ると余りが −3 になる。P(x) を (x−1)(x+2) で割った余りを求めよ。","i":"2次式で割った余りは1次以下の式 ax+b とおける。P(x)=(x−1)(x+2)Q(x)+ax+b に剰余の定理 P(1)=3, P(−2)=−3 を使う。","s":"①P(x)=(x−1)(x+2)Q(x)+ax+b とおく\n②P(1)=a+b=3, P(−2)=−2a+b=−3\n③a=2, b=1 → 余りは 2x+1","a":"2x+1","p":"「n次式で割った余りは (n−1) 次以下」とおくのが出発点。"},{"id":103,"f":"数学Ⅱ","u":"式と証明・複素数と方程式","n":"高次方程式を因数分解で解く","q":"方程式 x³−x²−4x+4=0 を解け。","i":"グループ分けによる因数分解、または因数定理(P(k)=0 となる k を探す)で因数分解して解く。","s":"①x²(x−1)−4(x−1)=0\n②(x−1)(x²−4)=0 → (x−1)(x−2)(x+2)=0\n③x=1, 2, −2","a":"x=1, 2, −2","p":"因数分解の途中で止めない。"},{"id":104,"f":"数学Ⅱ","u":"式と証明・複素数と方程式","n":"3次方程式の複素数解","q":"方程式 x³=8 を、複素数の範囲で解け。","i":"x³−8=0 を x³−a³=(x−a)(x²+ax+a²) で因数分解し、残りの2次方程式を解の公式で解く。","s":"①x³−8=(x−2)(x²+2x+4)=0\n②x=2 または x²+2x+4=0\n③x=−1±√3i","a":"x=2, −1±√3i","p":"虚数解もあわせて3個答える(3次方程式は複素数の範囲で3個の解をもつ)。"},{"id":105,"f":"数学Ⅱ","u":"式と証明・複素数と方程式","n":"複2次方程式","q":"方程式 x⁴+x²−6=0 を、複素数の範囲で解け。","i":"x²=t とおいて t の2次方程式にする。求めた t から x を求める(t が負なら x は虚数)。","s":"①x²=t とおくと t²+t−6=0 → (t+3)(t−2)=0\n②t=2 → x=±√2\n③t=−3 → x=±√3i","a":"x=±√2, ±√3i","p":"「複素数の範囲で」とあれば、実数解だけで終わらない。"},{"id":106,"f":"数学Ⅱ","u":"図形と方程式","n":"内分点・外分点の座標","q":"2点 A(1,2), B(7,5) について、線分 AB を 1:2 に内分する点 P と、3:1 に外分する点 Q の座標を求めよ。","i":"A(x₁,y₁), B(x₂,y₂) を m:n に内分する点は ((nx₁+mx₂)/(m+n), (ny₁+my₂)/(m+n))。外分は m−n を分母にして、n の符号を負にする。","s":"①P=((2·1+1·7)/3, (2·2+1·5)/3)=(3,3)\n②Q=((−1·1+3·7)/2, (−1·2+3·5)/2)=(10, 13/2)","a":"P(3,3), Q(10, 13/2)","p":"内分は「たすき掛け」(始点に後の比、終点に前の比)。外分は符号が変わる。"},{"id":107,"f":"数学Ⅱ","u":"図形と方程式","n":"平行四辺形の頂点・三角形の重心","q":"3点 A(1,1), B(5,2), C(6,5) について、(1)四角形 ABCD が平行四辺形となるような点 D の座標 (2)△ABC の重心 G の座標 を求めよ。","i":"平行四辺形の2本の対角線は互いの中点で交わる(AC の中点=BD の中点)。重心の座標は3頂点の座標の平均。","s":"①AC の中点=((1+6)/2, (1+5)/2)=(7/2, 3)\n②BD の中点がこれに一致 → D=(2·7/2−5, 2·3−2)=(2,4)\n③G=((1+5+6)/3, (1+2+5)/3)=(4, 8/3)","a":"D(2,4), G(4, 8/3)","p":"ABCD の頂点の順序から、対角線は AC と BD であることを確認する。"},{"id":108,"f":"数学Ⅱ","u":"図形と方程式","n":"平行・垂直な直線の方程式","q":"点(2,3)を通り、直線 2x−y+1=0 に (1)平行な直線 (2)垂直な直線 の方程式をそれぞれ求めよ。","i":"ax+by+c=0 に平行な直線は同じ (a,b) を、垂直な直線は (b,−a) を係数とする。傾きで考えるなら、垂直は傾きの積が −1。","s":"①(1)平行: 2(x−2)−(y−3)=0 → 2x−y−1=0\n②(2)垂直: 1·(x−2)+2(y−3)=0 → x+2y−8=0","a":"(1)2x−y−1=0 (2)x+2y−8=0","p":"垂直条件は傾きの積が −1(傾きが 0 や存在しない場合は別に考える)。"},{"id":109,"f":"数学Ⅱ","u":"図形と方程式","n":"点と直線の距離","q":"点(1,2)と直線 3x+4y−5=0 の距離を求めよ。","i":"点(x₀,y₀)と直線 ax+by+c=0 の距離は d=|ax₀+by₀+c|/√(a²+b²)。","s":"①d=|3·1+4·2−5|/√(3²+4²)\n②=6/5","a":"6/5","p":"直線を「=0」の形にそろえてから代入する。分子は絶対値。"},{"id":110,"f":"数学Ⅱ","u":"図形と方程式","n":"2直線の交点を通る直線","q":"2直線 x+y−3=0, 2x−y=0 の交点と、点(3,1)を通る直線の方程式を求めよ。","i":"2直線の交点を通る直線は k(2x−y)+(x+y−3)=0 の形で表せる(束の考え方)。通る点を代入して k を決める。","s":"①(x+y−3)+k(2x−y)=0 とおく\n②(3,1)を通る: (3+1−3)+k(6−1)=0 → 1+5k=0 → k=−1/5\n③5(x+y−3)−(2x−y)=0 → 3x+6y−15=0 → x+2y−5=0","a":"x+2y−5=0","p":"この形は「2x−y=0 そのもの」を表せない。求める直線がそうでないことを確認しておく。"},{"id":111,"f":"数学Ⅱ","u":"図形と方程式","n":"直線に関する対称な点","q":"直線 l: x−y+1=0 に関して、点 A(3,0) と対称な点 A' の座標を求めよ。","i":"①AA' は l に垂直 ②線分 AA' の中点は l 上にある、の2条件を使う。","s":"①AA' は l に垂直 → 直線 AA': x+y=3\n②l と AA' の交点 H: x−y+1=0, x+y=3 → H(1,2)\n③H は AA' の中点 → A'=(2·1−3, 2·2−0)=(−1,4)","a":"A'(−1,4)","p":"「垂直」と「中点が直線上」の2条件をセットで使う。"},{"id":112,"f":"数学Ⅱ","u":"図形と方程式","n":"3点を通る円の方程式","q":"3点 (0,0), (4,0), (0,2) を通る円の方程式を求めよ。また、その円の中心と半径を答えよ。","i":"円の一般形 x²+y²+lx+my+n=0 に3点を代入して連立方程式を解く。平方完成して中心と半径を読む。","s":"①(0,0): n=0\n②(4,0): 16+4l=0 → l=−4\n③(0,2): 4+2m=0 → m=−2\n④x²+y²−4x−2y=0 → (x−2)²+(y−1)²=5","a":"x²+y²−4x−2y=0、中心(2,1)、半径√5","p":"中心や半径が条件にあれば (x−a)²+(y−b)²=r²、通る3点なら一般形、と使い分ける。"},{"id":113,"f":"数学Ⅱ","u":"図形と方程式","n":"円と直線の位置関係(共有点の個数)","q":"円 x²+y²=5 と直線 y=2x+k の共有点の個数を、k の値で場合分けして答えよ。","i":"円の中心から直線までの距離 d と半径 r を比べる。d<r: 2点、d=r: 接する(1点)、d>r: 共有点なし。","s":"①直線 2x−y+k=0 と原点の距離 d=|k|/√5\n②半径 r=√5\n③|k|<5: 2個、|k|=5: 1個(接する)、|k|>5: 0個","a":"−5<k<5 のとき2個、k=±5 のとき1個、k<−5, 5<k のとき0個","p":"y を消去して判別式 D で調べる方法もある。計算が楽な方を選ぶ。"},{"id":114,"f":"数学Ⅱ","u":"図形と方程式","n":"円が直線から切り取る弦の長さ","q":"円 x²+y²=4 が直線 x+y=2 から切り取る弦の長さを求めよ。","i":"円の中心から直線までの距離 d を求め、三平方の定理で弦の長さ=2√(r²−d²)。","s":"①中心(0,0)と直線 x+y−2=0 の距離 d=2/√2=√2\n②半径 r=2\n③弦の長さ=2√(r²−d²)=2√(4−2)=2√2","a":"2√2","p":"√(r²−d²) は弦の「半分」の長さ。2倍を忘れない。"},{"id":115,"f":"数学Ⅱ","u":"図形と方程式","n":"円上の点における接線","q":"円 x²+y²=25 上の点(3,4)における接線の方程式を求めよ。","i":"円 x²+y²=r² 上の点(x₁,y₁)における接線の方程式は x₁x+y₁y=r²。","s":"①公式 x₁x+y₁y=r² に (x₁,y₁)=(3,4), r²=25 を代入\n②3x+4y=25\n③検算: 半径の傾き 4/3 と接線の傾き −3/4 の積が −1","a":"3x+4y=25","p":"中心が原点でない円の接線は、半径との垂直条件から導く(公式がそのまま使えない)。"},{"id":116,"f":"数学Ⅱ","u":"図形と方程式","n":"円の外の点から引く接線","q":"点(4,2)から円 x²+y²=10 に引いた接線の方程式を求めよ。","i":"接線を y−2=m(x−4) とおき、(円の中心と接線の距離)=(半径)から m を求める。y 軸に平行な接線の場合も確認する。","s":"①接線 mx−y−4m+2=0 と原点の距離が √10: |2−4m|/√(m²+1)=√10\n②両辺を2乗 (2−4m)²=10(m²+1) → 3m²−8m−3=0 → (3m+1)(m−3)=0\n③m=3, −1/3 → y=3x−10, x+3y−10=0\n④x=4 は円と共有点をもたないので不適","a":"y=3x−10 と x+3y−10=0","p":"傾きを m とおく方法では、y 軸に平行な直線 (x=定数) が漏れる。別に確認する。"},{"id":117,"f":"数学Ⅱ","u":"図形と方程式","n":"2円の位置関係","q":"円 C₁: x²+y²=4 と円 C₂: (x−3)²+y²=r² (r>0) について、(1)外接する (2)内接する (3)2点で交わる ような r の値(範囲)を求めよ。","i":"中心間距離 d と半径 r₁, r₂ を比べる。外接: d=r₁+r₂、内接: d=|r₁−r₂|、2点で交わる: |r₁−r₂|<d<r₁+r₂。","s":"①d=3, r₁=2\n②外接: 3=2+r → r=1\n③内接: 3=|r−2| → r=5(r=−1 は不適)\n④2点で交わる: |r−2|<3<2+r → 1<r<5","a":"(1)r=1 (2)r=5 (3)1<r<5","p":"内接は |r₁−r₂|=d。r>0 の条件で不適な解を除く。"},{"id":118,"f":"数学Ⅱ","u":"図形と方程式","n":"2円の交点を通る直線(共通弦)","q":"2つの円 x²+y²−4=0 と x²+y²−4x−2y+4=0 の2つの交点を通る直線の方程式を求めよ。","i":"2つの円の方程式の辺々を引くと、x², y² の項が消えて、2交点を通る直線の方程式になる。","s":"①(x²+y²−4)−(x²+y²−4x−2y+4)=0\n②4x+2y−8=0\n③2x+y−4=0","a":"2x+y−4=0","p":"2円が実際に交わっているか(中心間距離と半径の関係)を確認しておく。"},{"id":119,"f":"数学Ⅱ","u":"図形と方程式","n":"軌跡(2点からの距離の比が一定)","q":"2点 A(−1,0), B(2,0) からの距離の比が 2:1 であるような点 P の軌跡を求めよ。","i":"P(x,y) とおいて、条件 PA:PB=2:1 を PA²=4PB² の形で x, y の式にして整理する。","s":"①P(x,y) とおく。PA=2PB より PA²=4PB²\n②(x+1)²+y²=4{(x−2)²+y²}\n③3x²−18x+3y²+15=0 → x²+y²−6x+5=0\n④(x−3)²+y²=4","a":"中心(3,0)、半径2の円","p":"距離の条件は2乗した式で処理する。答えは図形の名前と方程式で書く。"},{"id":120,"f":"数学Ⅱ","u":"図形と方程式","n":"軌跡(動点の中点)","q":"点 Q が円 x²+y²=4 上を動くとき、Q と定点 A(6,0) を結ぶ線分 QA の中点 P の軌跡を求めよ。","i":"P(x,y)、Q(s,t) とおき、中点の関係から s, t を x, y で表し、Q がみたす条件(s²+t²=4)に代入する。","s":"①Q(s,t) は s²+t²=4 をみたす\n②P は QA の中点 → x=(s+6)/2, y=t/2 → s=2x−6, t=2y\n③(2x−6)²+(2y)²=4 → (x−3)²+y²=1","a":"中心(3,0)、半径1の円 (x−3)²+y²=1","p":"動点 Q の条件式に、P の座標 (x,y) を代入して x, y の関係式にする。"},{"id":121,"f":"数学Ⅱ","u":"図形と方程式","n":"不等式の表す領域と面積","q":"連立不等式 x²+y²≦4, x+y≧2 の表す領域の面積を求めよ。","i":"円の内部と直線の上側の共通部分を図示する。円と直線の交点から中心角を求め、「扇形−三角形」で弓形の面積を求める。","s":"①円の中心(0,0)と直線 x+y=2 の距離は √2、半径は 2\n②交点は (2,0), (0,2)。中心角は 90°\n③面積=扇形−三角形=(1/4)π·2²−(1/2)·2·2=π−2","a":"π−2","p":"境界線と円の交点を先に求める。弓形の面積=扇形−三角形。"},{"id":122,"f":"数学Ⅱ","u":"図形と方程式","n":"線形計画法(領域と最大・最小)","q":"x≧0, y≧0, x+2y≦6, 3x+y≦8 のとき、x+y の最大値を求めよ。","i":"領域(多角形)を図示し、x+y=k とおいて直線 y=−x+k を動かす。最大・最小は領域の頂点でとる。","s":"①領域の頂点: (0,0), (8/3,0), (2,2), (0,3)\n②(2,2)は x+2y=6 と 3x+y=8 の交点\n③x+y の値は 0, 8/3, 4, 3 → 最大は 4","a":"最大値 4(x=2, y=2 のとき)","p":"頂点の座標は連立方程式で正確に求める。傾きの大小で、どの頂点が最大になるかも確認する。"},{"id":123,"f":"数学Ⅱ","u":"図形と方程式","n":"円周上の点の1次式の最大・最小","q":"x²+y²=4 のとき、2x+y の最大値と最小値を求めよ。","i":"2x+y=k とおく。直線 2x+y−k=0 が円と共有点をもつ条件(中心との距離≦半径)から k の範囲を求める。","s":"①2x+y=k とおくと、直線 2x+y−k=0 と円 x²+y²=4 が共有点をもつ\n②中心との距離 |k|/√5≦2\n③−2√5≦k≦2√5","a":"最大値 2√5、最小値 −2√5","p":"「共有点をもつ」→ d≦r(等号を含む)。接点で最大・最小になる。"},{"id":124,"f":"数学Ⅱ","u":"三角関数","n":"弧度法と扇形の弧の長さ・面積","q":"半径 6、中心角 π/3 の扇形の弧の長さと面積を求めよ。","i":"弧度法では、弧の長さ l=rθ、面積 S=(1/2)r²θ=(1/2)rl。θ はラジアン。","s":"①l=6·π/3=2π\n②S=(1/2)·6²·(π/3)=6π","a":"弧の長さ 2π、面積 6π","p":"θ を度数(60°)のまま代入しない。必ずラジアンにする。"},{"id":125,"f":"数学Ⅱ","u":"三角関数","n":"一般角の三角関数の値","q":"sin(7π/6), cos(−π/3), tan(3π/4) の値を求めよ。","i":"単位円で考える。角を基準角(π/6, π/4, π/3)との関係に直し、象限で符号を決める。cos は偶関数、sin・tan は奇関数。","s":"①sin(7π/6)=sin(π+π/6)=−sin(π/6)=−1/2\n②cos(−π/3)=cos(π/3)=1/2\n③tan(3π/4)=tan(π−π/4)=−tan(π/4)=−1","a":"−1/2, 1/2, −1","p":"象限ごとの符号(第3象限では sin, cos が負、tan は正)を確認する。"},{"id":126,"f":"数学Ⅱ","u":"三角関数","n":"三角関数の相互関係と値(象限)","q":"π<θ<3π/2 で tanθ=2 のとき、cosθ と sinθ の値を求めよ。","i":"1+tan²θ=1/cos²θ から cosθ を求める。θ の範囲(第3象限)から sinθ, cosθ はともに負。","s":"①1/cos²θ=1+2²=5 → cos²θ=1/5\n②第3象限なので cosθ=−1/√5=−√5/5\n③sinθ=tanθ·cosθ=2·(−√5/5)=−2√5/5","a":"cosθ=−√5/5, sinθ=−2√5/5","p":"象限(角の範囲)から符号を決める。"},{"id":127,"f":"数学Ⅱ","u":"三角関数","n":"三角方程式(角が2倍になっている場合)","q":"0≦x<2π のとき、sin2x=√3/2 を解け。","i":"2x=t とおいて、t の範囲(0≦t<4π)で方程式を解き、x に戻す。","s":"①2x=t とおくと 0≦t<4π\n②sin t=√3/2 → t=π/3, 2π/3, 7π/3, 8π/3\n③x=π/6, π/3, 7π/6, 4π/3","a":"x=π/6, π/3, 7π/6, 4π/3","p":"範囲が 0≦t<4π(2周分)に広がることを見落とすと、解が半分になる。"},{"id":128,"f":"数学Ⅱ","u":"三角関数","n":"sin・cos の2次方程式","q":"0≦x<2π のとき、2cos²x+3sinx−3=0 を解け。","i":"cos²x=1−sin²x で sinx だけの式にし、sinx=t(−1≦t≦1)とおいて2次方程式を解く。","s":"①2(1−sin²x)+3sinx−3=0 → 2sin²x−3sinx+1=0\n②(2sinx−1)(sinx−1)=0 → sinx=1/2, 1\n③sinx=1/2 → x=π/6, 5π/6、sinx=1 → x=π/2","a":"x=π/6, π/2, 5π/6","p":"sinx=1 の解(x=π/2)を落としやすい。t の範囲 −1≦t≦1 を確認する。"},{"id":129,"f":"数学Ⅱ","u":"三角関数","n":"三角不等式","q":"0≦x<2π のとき、2cosx+1≧0 を解け。","i":"cosx≧−1/2 とし、単位円で x座標が −1/2 以上となる角の範囲を読む(または cos のグラフで考える)。","s":"①cosx≧−1/2\n②cosx=−1/2 となる x は 2π/3, 4π/3\n③単位円の x座標が −1/2 以上の範囲 → 0≦x≦2π/3, 4π/3≦x<2π","a":"0≦x≦2π/3, 4π/3≦x<2π","p":"区間が2つに分かれる。端点が 0 と 2π をまたぐので、グラフで確認する。"},{"id":130,"f":"数学Ⅱ","u":"三角関数","n":"加法定理で特別でない角の値を求める","q":"sin75° と tan105° の値を求めよ。","i":"75°=45°+30°、105°=60°+45° のように、値のわかる角の和・差に分けて加法定理を使う。","s":"①sin75°=sin45°cos30°+cos45°sin30°=(√6+√2)/4\n②tan105°=(tan60°+tan45°)/(1−tan60°tan45°)=(√3+1)/(1−√3)\n③有理化して −(2+√3)","a":"sin75°=(√6+√2)/4, tan105°=−2−√3","p":"cos の加法定理は符号が逆(cos(α+β)=cosαcosβ−sinαsinβ)。"},{"id":131,"f":"数学Ⅱ","u":"三角関数","n":"加法定理(条件から値を求める)","q":"sinα=3/5 (0<α<π/2), cosβ=−5/13 (π/2<β<π) のとき、sin(α+β) と cos(α+β) の値を求めよ。","i":"まず cosα, sinβ を範囲から符号を決めて求め、加法定理に代入する。","s":"①cosα=4/5、sinβ=12/13(β は第2象限なので sinβ>0)\n②sin(α+β)=sinαcosβ+cosαsinβ=(3/5)(−5/13)+(4/5)(12/13)=33/65\n③cos(α+β)=cosαcosβ−sinαsinβ=(4/5)(−5/13)−(3/5)(12/13)=−56/65","a":"sin(α+β)=33/65, cos(α+β)=−56/65","p":"cosα, sinβ の符号を、α, β の範囲から決める。"},{"id":132,"f":"数学Ⅱ","u":"三角関数","n":"2倍角の公式","q":"π/2<θ<π で sinθ=3/5 のとき、sin2θ と cos2θ の値を求めよ。","i":"2倍角の公式 sin2θ=2sinθcosθ、cos2θ=1−2sin²θ。cosθ は範囲から符号を決める。","s":"①cosθ=−4/5(第2象限)\n②sin2θ=2·(3/5)·(−4/5)=−24/25\n③cos2θ=1−2·(9/25)=7/25","a":"sin2θ=−24/25, cos2θ=7/25","p":"cosθ の符号に注意。cos2θ は3通りの形のうち、与えられた値で計算しやすいものを選ぶ。"},{"id":133,"f":"数学Ⅱ","u":"三角関数","n":"三角関数の合成と最大・最小","q":"0≦x<2π のとき、y=√3 sinx−cosx の最大値と最小値、およびそのときの x の値を求めよ。","i":"a sinx+b cosx=√(a²+b²)·sin(x+α) と合成し、角の範囲から最大・最小を読む。","s":"①y=2sin(x−π/6)\n②−π/6≦x−π/6<11π/6\n③x−π/6=π/2 → x=2π/3 で最大値 2\n④x−π/6=3π/2 → x=5π/3 で最小値 −2","a":"最大値 2 (x=2π/3)、最小値 −2 (x=5π/3)","p":"合成後の角(x−π/6)の範囲を必ず書き換えてから考える。"},{"id":134,"f":"数学Ⅱ","u":"三角関数","n":"合成を利用した三角方程式","q":"0≦x<2π のとき、sinx+√3cosx=1 を解け。","i":"左辺を合成して 2sin(x+π/3)=1 とし、x+π/3 の範囲に注意して解く。","s":"①2sin(x+π/3)=1 → sin(x+π/3)=1/2\n②π/3≦x+π/3<7π/3\n③x+π/3=5π/6, 13π/6\n④x=π/2, 11π/6","a":"x=π/2, 11π/6","p":"範囲が π/3≦x+π/3<7π/3 なので、x+π/3=π/6 は範囲外。"},{"id":135,"f":"数学Ⅱ","u":"三角関数","n":"sinθ+cosθ=t とおく問題","q":"0≦θ<2π のとき、y=sinθcosθ+sinθ+cosθ の最大値と最小値を求めよ。","i":"sinθ+cosθ=t とおくと sinθcosθ=(t²−1)/2 となり t の2次関数になる。t の範囲は合成から −√2≦t≦√2。","s":"①t=sinθ+cosθ=√2sin(θ+π/4) より −√2≦t≦√2\n②sinθcosθ=(t²−1)/2\n③y=(t²−1)/2+t=(1/2)(t+1)²−1\n④t=−1 で最小値 −1、t=√2 で最大値 (1/2)(√2+1)²−1=√2+1/2","a":"最大値 √2+1/2、最小値 −1","p":"t の範囲を必ず調べる。頂点 t=−1 が範囲内かどうかを確認する。"},{"id":136,"f":"数学Ⅱ","u":"三角関数","n":"sinθ のみの2次関数に直す","q":"y=cos²θ+2sinθ の最大値と最小値を求めよ。","i":"cos²θ=1−sin²θ として sinθ=t(−1≦t≦1)の2次関数にする。","s":"①y=1−t²+2t=−(t−1)²+2\n②−1≦t≦1 で、t=1 のとき最大値 2\n③t=−1 のとき最小値 −(−2)²+2=−2","a":"最大値 2 (θ=π/2)、最小値 −2 (θ=3π/2)","p":"t の変域 −1≦t≦1 を確認する。頂点が範囲の端のとき、反対の端で最小になる。"},{"id":137,"f":"数学Ⅱ","u":"三角関数","n":"三角関数のグラフ(周期・最大・最小)","q":"y=2sin(3x−π)+1 の周期、最大値、最小値を求めよ。","i":"y=a sin(bx+c)+d の周期は 2π/|b|、最大値は |a|+d、最小値は −|a|+d。","s":"①周期=2π/3\n②最大値=2+1=3\n③最小値=−2+1=−1","a":"周期 2π/3、最大値 3、最小値 −1","p":"周期は 2π を x の係数で割る。位相のずれ(−π)や平行移動は周期に影響しない。"},{"id":138,"f":"数学Ⅱ","u":"指数関数・対数関数","n":"指数法則と累乗根の計算","q":"4^(1/3) × 16^(1/6) ÷ 2^(1/3) を簡単にせよ。","i":"底をそろえて(2の累乗に直して)、指数法則 aᵖ·aᵠ=aᵖ⁺ᵠ、(aᵖ)ᵠ=aᵖᵠ を使う。","s":"①4^(1/3)=2^(2/3)、16^(1/6)=2^(4/6)=2^(2/3)\n②2^(2/3)·2^(2/3)÷2^(1/3)=2^(2/3+2/3−1/3)=2¹\n③=2","a":"2","p":"底を素数にそろえてから指数の計算をする。指数の分数の通分でミスしやすい。"},{"id":139,"f":"数学Ⅱ","u":"指数関数・対数関数","n":"指数方程式・不等式(おき換え)","q":"(1)方程式 4ˣ−3·2ˣ−4=0 を解け。 (2)不等式 4ˣ−3·2ˣ−4>0 を解け。","i":"2ˣ=t(t>0)とおいて t の2次方程式・不等式に直す。t>0 の条件を忘れない。","s":"①t=2ˣ>0 とおくと t²−3t−4=0 → (t−4)(t+1)=0\n②t>0 より t=4 → 2ˣ=4 → x=2\n③(2)(t−4)(t+1)>0 かつ t>0 より t>4 → 2ˣ>4 → x>2","a":"(1)x=2 (2)x>2","p":"t>0 の条件で t=−1 を除く。"},{"id":140,"f":"数学Ⅱ","u":"指数関数・対数関数","n":"指数関数の最大・最小","q":"−1≦x≦3 のとき、y=4ˣ−2ˣ⁺²+3 の最大値と最小値を求めよ。","i":"2ˣ=t とおき、x の範囲から t の範囲(1/2≦t≦8)を求めて、t の2次関数の最大・最小を考える。","s":"①2ˣ⁺²=4·2ˣ より y=t²−4t+3=(t−2)²−1\n②−1≦x≦3 より 1/2≦t≦8\n③t=2(x=1)で最小値 −1\n④t=1/2 のとき 5/4、t=8(x=3)のとき 35 → 最大値 35","a":"最大値 35 (x=3)、最小値 −1 (x=1)","p":"t の範囲を x の範囲から正しく求める。端点の値を両方比べる。"},{"id":141,"f":"数学Ⅱ","u":"指数関数・対数関数","n":"累乗根の大小比較","q":"√2, ³√3, ⁶√5 を小さい順に並べよ。","i":"累乗根の大小は、指数の分母の最小公倍数(ここでは6)乗して比べる。","s":"①6乗する: (√2)⁶=8, (³√3)⁶=9, (⁶√5)⁶=5\n②5<8<9 より ⁶√5<√2<³√3","a":"⁶√5 < √2 < ³√3","p":"正の数どうしなら、同じ乗数で比べても大小は変わらない。"},{"id":142,"f":"数学Ⅱ","u":"指数関数・対数関数","n":"対数の計算(性質と底の変換)","q":"次の値を求めよ。 (1)log₂12+log₂(2/3) (2)log₄8 (3)log₂3·log₃8","i":"対数の性質 logM+logN=logMN と、底の変換公式 log_a b=log_c b/log_c a を使う。","s":"①(1)log₂(12·2/3)=log₂8=3\n②(2)log₄8=log₂8/log₂4=3/2\n③(3)log₂3·log₃8=log₂3·(log₂8/log₂3)=3","a":"(1)3 (2)3/2 (3)3","p":"底をそろえる。(3)のように分母と分子が約分されて消える形は頻出。"},{"id":143,"f":"数学Ⅱ","u":"指数関数・対数関数","n":"対数方程式(真数条件)","q":"方程式 log₂(x−1)+log₂(x+1)=3 を解け。","i":"真数条件(真数>0)を先に確認する。1つの対数にまとめて、指数の形に直して解く。","s":"①真数条件 x−1>0 かつ x+1>0 → x>1\n②log₂(x−1)(x+1)=3 → x²−1=8 → x=±3\n③x>1 より x=3","a":"x=3","p":"真数条件を確認し、x=−3 を除く。"},{"id":144,"f":"数学Ⅱ","u":"指数関数・対数関数","n":"対数不等式(底の大小に注意)","q":"(1)log₂(x−1)≦2 (2)log_{1/2}(x−1)≧−1 を解け。","i":"真数条件を確認する。底が1より大きいときは不等号の向きはそのまま、底が1未満のときは逆向きになる。","s":"①(1)真数条件 x>1、log₂(x−1)≦log₂4。底 2>1 なので x−1≦4 → 1<x≦5\n②(2)log_{1/2}(x−1)≧log_{1/2}2。底 1/2<1 なので不等号が逆向きになり x−1≦2 → 1<x≦3","a":"(1)1<x≦5 (2)1<x≦3","p":"底が 1 未満のとき、不等号の向きが変わる。真数条件との共通部分をとる。"},{"id":145,"f":"数学Ⅱ","u":"指数関数・対数関数","n":"対数関数の最大・最小(おき換え)","q":"1≦x≦8 のとき、y=(log₂x)²−4log₂x+5 の最大値と最小値を求めよ。","i":"log₂x=t とおき、x の範囲から t の範囲(0≦t≦3)を求めて t の2次関数の最大・最小を考える。","s":"①t=log₂x とおくと 0≦t≦3\n②y=t²−4t+5=(t−2)²+1\n③t=2(x=4)で最小値 1\n④t=0(x=1)のとき 5、t=3(x=8)のとき 2 → 最大値 5","a":"最大値 5 (x=1)、最小値 1 (x=4)","p":"t の範囲を確認する。両端の値を比べて最大値を決める。"},{"id":146,"f":"数学Ⅱ","u":"指数関数・対数関数","n":"常用対数(桁数と最高位の数字)","q":"log₁₀2=0.3010 とする。2⁵⁰ は何桁の整数か。また、最高位の数字は何か。","i":"log₁₀N=n+α(n は整数、0≦α<1)のとき N は (n+1) 桁。最高位の数字は α と log₁₀k(k=1,2,…)を比べて決める。","s":"①log₁₀2⁵⁰=50×0.3010=15.05\n②15≦15.05<16 より 10¹⁵≦2⁵⁰<10¹⁶ → 16桁\n③小数部分 0.05 は log₁₀1=0 と log₁₀2=0.3010 の間 → 最高位の数字は 1","a":"16桁、最高位の数字は 1","p":"桁数は「整数部分+1」。最高位の数字は小数部分で決まる。"},{"id":147,"f":"数学Ⅱ","u":"指数関数・対数関数","n":"底が異なる対数の方程式","q":"方程式 log₂x+logₓ2=5/2 を解け。","i":"底の変換で logₓ2=1/log₂x と直し、log₂x=t とおいて t の方程式にする。底の条件(x>0, x≠1)を確認する。","s":"①底・真数条件 x>0, x≠1\n②t=log₂x とおくと logₓ2=1/t → t+1/t=5/2\n③2t²−5t+2=0 → (2t−1)(t−2)=0 → t=1/2, 2\n④x=2^(1/2)=√2、x=2²=4","a":"x=√2, 4","p":"t≠0(x≠1)の条件を確認する。"},{"id":148,"f":"数学Ⅱ","u":"微分と積分","n":"導関数と微分係数","q":"f(x)=x³−3x²+2x のとき、f'(x) と f'(1) の値を求めよ。","i":"(xⁿ)'=nxⁿ⁻¹、定数の微分は 0。微分係数 f'(a) は導関数に x=a を代入して求める。","s":"①f'(x)=3x²−6x+2\n②f'(1)=3−6+2=−1","a":"f'(x)=3x²−6x+2、f'(1)=−1","p":"(kxⁿ)'=knxⁿ⁻¹ の係数 n のかけ忘れ。"},{"id":149,"f":"数学Ⅱ","u":"微分と積分","n":"接線の方程式(接点が与えられている)","q":"曲線 y=x³−3x 上の点 (2,2) における接線の方程式を求めよ。","i":"曲線 y=f(x) 上の点 (a,f(a)) における接線は y−f(a)=f'(a)(x−a)。","s":"①f'(x)=3x²−3 → f'(2)=9\n②y−2=9(x−2)\n③y=9x−16","a":"y=9x−16","p":"接点の座標が曲線上にあるか確認する(2³−3·2=2)。"},{"id":150,"f":"数学Ⅱ","u":"微分と積分","n":"接線の方程式(曲線外の点から引く)","q":"点 A(1,−3) を通り、放物線 y=x² に接する直線の方程式を求めよ。","i":"接点を (t,t²) とおいて接線 y=2tx−t² を作り、それが点 A を通る条件から t を求める。","s":"①接点 (t,t²) における接線: y−t²=2t(x−t) → y=2tx−t²\n②A(1,−3) を通る: −3=2t−t² → t²−2t−3=0 → t=3, −1\n③t=3: y=6x−9、t=−1: y=−2x−1","a":"y=6x−9, y=−2x−1","p":"与えられた点は「接点」ではなく「接線が通る点」。接点を文字 t でおく。"},{"id":151,"f":"数学Ⅱ","u":"微分と積分","n":"傾きが与えられた接線","q":"曲線 y=x³−3x の接線のうち、傾きが 9 であるものをすべて求めよ。","i":"接点の x 座標を t とすると、接線の傾きは f'(t)。f'(t)=9 を解いて接点を求める。","s":"①f'(t)=3t²−3=9 → t²=4 → t=±2\n②t=2: 接点 (2,2) → y=9x−16\n③t=−2: 接点 (−2,−2) → y+2=9(x+2) → y=9x+16","a":"y=9x−16, y=9x+16","p":"接点が2つあるので、接線も2本。片方だけで終わらない。"},{"id":152,"f":"数学Ⅱ","u":"微分と積分","n":"増減表と極値","q":"f(x)=x³−6x²+9x+1 の増減を調べ、極値を求めよ。","i":"f'(x)=0 となる x の前後での f'(x) の符号を増減表で調べる。+ から − で極大、− から + で極小。","s":"①f'(x)=3x²−12x+9=3(x−1)(x−3)\n②x<1 で f'>0(増加)、1<x<3 で f'<0(減少)、x>3 で f'>0(増加)\n③極大値 f(1)=5、極小値 f(3)=1","a":"x=1 で極大値 5、x=3 で極小値 1","p":"f'(x)=0 でも符号が変わらなければ極値ではない。"},{"id":153,"f":"数学Ⅱ","u":"微分と積分","n":"極値の条件から係数を決定","q":"3次関数 f(x)=x³+ax²+bx+c が、x=−1 で極大値 4 をとり、x=3 で極小値をとるとき、定数 a, b, c の値を求めよ。","i":"極値をとる x で f'(x)=0。f'(−1)=0, f'(3)=0, f(−1)=4 の3条件で決める。最後に増減表で確認する。","s":"①f'(x)=3x²+2ax+b。f'(−1)=3−2a+b=0、f'(3)=27+6a+b=0\n②連立して a=−3, b=−9\n③f(−1)=−1+a−b+c=−1−3+9+c=4 → c=−1\n④f'(x)=3(x+1)(x−3) より、確かに x=−1 で極大、x=3 で極小","a":"a=−3, b=−9, c=−1","p":"f'(x)=0 は必要条件。符号変化(極大・極小)の確認が十分性の確認になる。"},{"id":154,"f":"数学Ⅱ","u":"微分と積分","n":"閉区間での最大・最小","q":"0≦x≦4 のとき、f(x)=x³−3x²+1 の最大値と最小値を求めよ。","i":"区間内の極値と、区間の両端の値をすべて比べる。","s":"①f'(x)=3x²−6x=3x(x−2)\n②f(0)=1, f(2)=8−12+1=−3, f(4)=64−48+1=17\n③最大値 17 (x=4)、最小値 −3 (x=2)","a":"最大値 17 (x=4)、最小値 −3 (x=2)","p":"極値だけでなく端点の値も必ず比べる。"},{"id":155,"f":"数学Ⅱ","u":"微分と積分","n":"3次方程式の実数解の個数","q":"x³−3x+k=0 の異なる実数解の個数を、定数 k の値で場合分けして答えよ。","i":"定数を分離して x³−3x=−k とし、y=x³−3x のグラフと水平線 y=−k の共有点の個数を調べる。","s":"①f(x)=x³−3x、f'(x)=3(x+1)(x−1) → 極大値 f(−1)=2、極小値 f(1)=−2\n②y=f(x) と y=−k の共有点を調べる\n③−2<−k<2 のとき3個、−k=±2 のとき2個、|−k|>2 のとき1個","a":"−2<k<2 のとき3個; k=±2 のとき2個; k<−2, 2<k のとき1個","p":"水平線は y=−k(符号に注意)。接する場合(k=±2)は2個。"},{"id":156,"f":"数学Ⅱ","u":"微分と積分","n":"微分を利用した不等式の証明","q":"x≧0 のとき、不等式 x³+2≧3x が成り立つことを示せ。","i":"f(x)=(左辺)−(右辺) とおき、指定された範囲で f(x) の最小値が 0 以上であることを増減表から示す。","s":"①f(x)=x³−3x+2 とおく\n②f'(x)=3(x+1)(x−1)。x≧0 では x=1 で最小\n③f(1)=0 なので x≧0 で f(x)≧0。等号は x=1 のとき","a":"(証明)f(x)=x³−3x+2 は x≧0 で x=1 のとき最小値 f(1)=0 をとるので f(x)≧0。","p":"最小値をとる点(等号成立条件)まで書く。"},{"id":157,"f":"数学Ⅱ","u":"微分と積分","n":"文章題(体積の最大)","q":"1辺 12cm の正方形の厚紙の四隅から、1辺 x cm の正方形を切り取り、残りを折り曲げてふたのない箱を作る。箱の容積の最大値を求めよ。","i":"x の変域(0<x<6)を先に求め、容積を x の式で表して微分し、増減表から最大値を求める。","s":"①底面は1辺 12−2x の正方形、高さは x → V=x(12−2x)²(0<x<6)\n②V'=(12−2x)²−4x(12−2x)=(12−2x)(12−6x)=12(6−x)(2−x)\n③0<x<2 で V'>0、2<x<6 で V'<0 → x=2 で最大\n④V(2)=2·8²=128","a":"最大値 128 cm³ (x=2 のとき)","p":"変域(0<x<6)を最初に求める。"},{"id":158,"f":"数学Ⅱ","u":"微分と積分","n":"不定積分","q":"∫(3x²−4x+5)dx を求めよ。","i":"∫xⁿdx=xⁿ⁺¹/(n+1)+C を項ごとに使う。積分定数 C を書く。","s":"①∫3x²dx=x³、∫4x dx=2x²、∫5dx=5x\n②x³−2x²+5x+C","a":"x³−2x²+5x+C","p":"積分定数 C を書き忘れない。"},{"id":159,"f":"数学Ⅱ","u":"微分と積分","n":"定積分の計算","q":"∫₀² (x²−2x+3)dx を求めよ。","i":"原始関数 F(x) を求めて F(上端)−F(下端) を計算する。","s":"①F(x)=x³/3−x²+3x\n②F(2)−F(0)=8/3−4+6\n③=14/3","a":"14/3","p":"計算ミスが多い。F(2) の通分と符号を丁寧に。"},{"id":160,"f":"数学Ⅱ","u":"微分と積分","n":"絶対値を含む定積分","q":"∫₀³ |x−1| dx を求めよ。","i":"絶対値の中が 0 になる x(=1)で積分区間を分け、符号に応じて絶対値をはずす。","s":"①0≦x≦1 で |x−1|=1−x、1≦x≦3 で |x−1|=x−1\n②∫₀¹(1−x)dx=1/2、∫₁³(x−1)dx=[x²/2−x]₁³=(9/2−3)−(1/2−1)=2\n③1/2+2=5/2","a":"5/2","p":"グラフ(V字形)の面積と考えても検算できる。"},{"id":161,"f":"数学Ⅱ","u":"微分と積分","n":"定積分で表された関数(定数とおく)","q":"f(x)=3x²+x∫₀¹ f(t)dt を満たす関数 f(x) を求めよ。","i":"∫₀¹ f(t)dt は定数。k とおいて f(x)=3x²+kx とし、k=∫₀¹ f(t)dt に代入して k を決める。","s":"①k=∫₀¹ f(t)dt とおくと f(x)=3x²+kx\n②k=∫₀¹(3t²+kt)dt=[t³+kt²/2]₀¹=1+k/2\n③k/2=1 → k=2\n④f(x)=3x²+2x","a":"f(x)=3x²+2x","p":"積分変数が t でも、定積分の値は定数。"},{"id":162,"f":"数学Ⅱ","u":"微分と積分","n":"上端が x の積分と微分","q":"関数 f(x) が ∫ₐˣ f(t)dt=x²−3x+2 を満たすとき、f(x) と定数 a の値を求めよ。","i":"両辺を x で微分して f(x) を求める(d/dx∫ₐˣ f(t)dt=f(x))。x=a を代入すると左辺が 0 になることから a を求める。","s":"①両辺を x で微分 → f(x)=2x−3\n②x=a を代入: 0=a²−3a+2\n③(a−1)(a−2)=0 → a=1, 2","a":"f(x)=2x−3、a=1, 2","p":"微分だけで終わらず、x=a の代入で a を求める。"},{"id":163,"f":"数学Ⅱ","u":"微分と積分","n":"放物線とx軸で囲まれた面積","q":"放物線 y=−x²+2x+3 と x軸で囲まれた部分の面積を求めよ。","i":"x軸との交点 x=α, β を求め、(上)−(下) を積分する。x² の係数が a の放物線と x軸で囲まれる面積は |a|(β−α)³/6。","s":"①−x²+2x+3=0 → x=−1, 3\n②−1≦x≦3 で y≧0\n③S=∫₋₁³(−x²+2x+3)dx=[−x³/3+x²+3x]₋₁³=9−(−5/3)=32/3","a":"32/3","p":"公式 |a|(β−α)³/6 でも検算できる(1·4³/6=32/3)。"},{"id":164,"f":"数学Ⅱ","u":"微分と積分","n":"放物線と直線で囲まれた面積","q":"放物線 y=x² と直線 y=x+2 で囲まれた部分の面積を求めよ。","i":"交点の x 座標 α, β を求め、(上)−(下) を積分する。公式: x² の係数が 1 の放物線と直線で囲まれる面積は (β−α)³/6。","s":"①x²=x+2 → x=−1, 2\n②−1≦x≦2 で x+2≧x²\n③S=∫₋₁²(−x²+x+2)dx=(1/6)(2+1)³=27/6=9/2","a":"9/2","p":"どちらが上かを確認して「上−下」にする。"},{"id":165,"f":"数学Ⅱ","u":"微分と積分","n":"符号が変わる区間の面積","q":"曲線 y=x³−x と x軸で囲まれた部分の面積を求めよ。","i":"x軸との交点を求め、曲線が x軸の上側か下側かを区間ごとに調べ、符号に応じて積分する(下側なら −f(x) を積分)。","s":"①x³−x=x(x−1)(x+1)=0 → x=−1, 0, 1\n②−1≦x≦0 で y≧0、0≦x≦1 で y≦0\n③S=∫₋₁⁰(x³−x)dx+∫₀¹(−x³+x)dx=1/4+1/4=1/2","a":"1/2","p":"x軸の下側の部分を単純に積分すると負の値になる。符号に注意。"},{"id":166,"f":"数学Ⅱ","u":"微分と積分","n":"曲線と接線で囲まれた面積","q":"放物線 y=x² 上の点 (1,1) における接線を l とする。放物線、l、y軸で囲まれた部分の面積を求めよ。","i":"接線の方程式を求め、(放物線)−(接線)=(x−接点のx座標)² を積分する。","s":"①y'=2x より l: y−1=2(x−1) → y=2x−1\n②0≦x≦1 で x²−(2x−1)=(x−1)²≧0\n③S=∫₀¹(x−1)²dx=[(x−1)³/3]₀¹=1/3","a":"1/3","p":"放物線と接線の差は必ず (x−接点)² の形になる(検算に使える)。"},{"id":167,"f":"数学Ⅱ","u":"微分と積分","n":"囲まれた面積の最小値","q":"放物線 y=x² と直線 y=ax+1 で囲まれた部分の面積 S(a) の最小値を求めよ。","i":"交点の x 座標を α<β として S=(β−α)³/6。(β−α)² を解と係数の関係で a の式にして、最小値を調べる。","s":"①x²−ax−1=0 の2解を α<β とすると α+β=a, αβ=−1\n②(β−α)²=(α+β)²−4αβ=a²+4\n③S=(a²+4)^(3/2)/6\n④a=0 のとき最小で S=8/6=4/3","a":"最小値 4/3 (a=0 のとき)","p":"交点を具体的に求めず、解と係数の関係で (β−α)² を処理する。"},{"id":168,"f":"数学B","u":"数列","n":"等差数列の一般項と和","q":"等差数列{aₙ}で a₃=7, a₈=22 のとき、一般項 aₙ と、初項から第10項までの和 S₁₀ を求めよ。","i":"等差数列は aₙ=a₁+(n−1)d。2つの項の条件から a₁ と d を連立方程式で求める。和は Sₙ=n(a₁+aₙ)/2。","s":"①a₁+2d=7, a₁+7d=22 → d=3, a₁=1\n②aₙ=1+3(n−1)=3n−2\n③a₁₀=28、S₁₀=10(1+28)/2=145","a":"aₙ=3n−2、S₁₀=145","p":"第3項は a₁+2d(n−1=2)。項番号と d の個数のずれに注意。"},{"id":169,"f":"数学B","u":"数列","n":"等比数列の一般項と和","q":"等比数列{aₙ}で a₂=6, a₅=48 のとき、初項、公比、および初項から第8項までの和を求めよ。","i":"等比数列は aₙ=a₁rⁿ⁻¹。a₅/a₂=r³ から公比を求める。和は Sₙ=a₁(rⁿ−1)/(r−1)(r≠1)。","s":"①r³=48/6=8 → r=2(実数)\n②a₁=6/2=3\n③S₈=3(2⁸−1)/(2−1)=3·255=765","a":"初項 3、公比 2、S₈=765","p":"公比 r=1 のときは別の公式 Sₙ=na₁。ここは r=2。"},{"id":170,"f":"数学B","u":"数列","n":"等差中項・等比中項","q":"3つの数 2, x, 18 がこの順に (1)等差数列 (2)等比数列 をなすとき、x の値を求めよ。","i":"3数 a, b, c が等差数列 ⇔ 2b=a+c、等比数列 ⇔ b²=ac。","s":"①(1)2x=2+18 → x=10\n②(2)x²=2·18=36 → x=±6","a":"(1)x=10 (2)x=±6","p":"等比中項は正負2つ(公比が負の場合も含まれる)。"},{"id":171,"f":"数学B","u":"数列","n":"Σ の計算(公式の利用)","q":"Σ_{k=1}^{n}(k²+2k) を n の式で表せ。","i":"Σk=n(n+1)/2、Σk²=n(n+1)(2n+1)/6、Σc=cn の公式を使い、共通因数 n(n+1) でくくる。","s":"①Σk²=n(n+1)(2n+1)/6、Σ2k=n(n+1)\n②n(n+1){(2n+1)/6+1}\n③=n(n+1)(2n+7)/6","a":"n(n+1)(2n+7)/6","p":"n=1 を代入して検算する(k=1 のとき 1+2=3、公式で 1·2·9/6=3)。"},{"id":172,"f":"数学B","u":"数列","n":"階差数列から一般項を求める","q":"数列 1, 2, 5, 10, 17, … の一般項を求めよ。","i":"階差数列 bₙ=aₙ₊₁−aₙ を調べ、n≧2 のとき aₙ=a₁+Σ_{k=1}^{n−1}bₖ。最後に n=1 でも成り立つか確認する。","s":"①階差は 1, 3, 5, 7, … → bₙ=2n−1\n②n≧2: aₙ=1+Σ_{k=1}^{n−1}(2k−1)=1+(n−1)²=n²−2n+2\n③n=1 のとき 1−2+2=1=a₁ → すべての n で成り立つ","a":"aₙ=n²−2n+2","p":"Σ の上端は n−1。n=1 で成り立つかの確認を忘れない。"},{"id":173,"f":"数学B","u":"数列","n":"部分分数に分けて和を求める","q":"Σ_{k=1}^{n} 1/{k(k+1)} を求めよ。","i":"1/{k(k+1)}=1/k−1/(k+1) と分解し、隣り合う項が打ち消し合う(差の形)ことを利用する。","s":"①1/{k(k+1)}=1/k−1/(k+1)\n②(1−1/2)+(1/2−1/3)+…+(1/n−1/(n+1))\n③=1−1/(n+1)=n/(n+1)","a":"n/(n+1)","p":"打ち消し合って残るのは最初と最後の項だけ。"},{"id":174,"f":"数学B","u":"数列","n":"分母の有理化を利用した和","q":"Σ_{k=1}^{n} 1/(√k+√(k+1)) を求めよ。","i":"分母を有理化すると √(k+1)−√k となり、差の形で隣り合う項が打ち消し合う。","s":"①1/(√k+√(k+1))=(√(k+1)−√k)/{(k+1)−k}=√(k+1)−√k\n②(√2−1)+(√3−√2)+…+(√(n+1)−√n)\n③=√(n+1)−1","a":"√(n+1)−1","p":"有理化すると分母が 1 になる。n=1 で検算(1/(1+√2)=√2−1)。"},{"id":175,"f":"数学B","u":"数列","n":"(等差)×(等比)の和","q":"S=1·1+2·2+3·2²+…+n·2ⁿ⁻¹ を求めよ。","i":"公比(ここでは 2)を S にかけた式との差をとり、等比数列の和に帰着させる。","s":"①S=1+2·2+3·2²+…+n·2ⁿ⁻¹\n②2S=1·2+2·2²+…+(n−1)·2ⁿ⁻¹+n·2ⁿ\n③S−2S=1+2+2²+…+2ⁿ⁻¹−n·2ⁿ → −S=(2ⁿ−1)−n·2ⁿ\n④S=(n−1)·2ⁿ+1","a":"S=(n−1)·2ⁿ+1","p":"項をずらして引くこと。最後の項(n·2ⁿ)の符号に注意。n=1, 2 で検算(1, 5)。"},{"id":176,"f":"数学B","u":"数列","n":"漸化式 aₙ₊₁=p·aₙ+q","q":"a₁=1, aₙ₊₁=2aₙ+3 で定まる数列{aₙ}の一般項を求めよ。","i":"特性方程式 α=2α+3 の解 α=−3 を使い、aₙ₊₁−α=2(aₙ−α) の形に変形して等比数列とみる。","s":"①α=2α+3 → α=−3\n②aₙ₊₁+3=2(aₙ+3)\n③{aₙ+3} は初項 a₁+3=4、公比 2 の等比数列 → aₙ+3=4·2ⁿ⁻¹=2ⁿ⁺¹\n④aₙ=2ⁿ⁺¹−3","a":"aₙ=2ⁿ⁺¹−3","p":"初項は a₁+3=4(a₁ ではない)。a₂=5 で検算。"},{"id":177,"f":"数学B","u":"数列","n":"階差型の漸化式","q":"a₁=2, aₙ₊₁=aₙ+3ⁿ で定まる数列{aₙ}の一般項を求めよ。","i":"aₙ₊₁−aₙ=3ⁿ より階差数列が 3ⁿ。n≧2 のとき aₙ=a₁+Σ_{k=1}^{n−1}3ᵏ。","s":"①n≧2: aₙ=2+Σ_{k=1}^{n−1}3ᵏ=2+3(3ⁿ⁻¹−1)/(3−1)\n②=2+(3ⁿ−3)/2=(3ⁿ+1)/2\n③n=1 のとき (3+1)/2=2=a₁ → すべての n で成り立つ","a":"aₙ=(3ⁿ+1)/2","p":"等比数列の和の項数に注意(k=1〜n−1 は n−1 項)。n=1 の確認も忘れない。"},{"id":178,"f":"数学B","u":"数列","n":"漸化式 aₙ₊₁=p·aₙ+qⁿ","q":"a₁=1, aₙ₊₁=2aₙ+3ⁿ で定まる数列{aₙ}の一般項を求めよ。","i":"3ⁿ のかたまりを引いて、aₙ₊₁−3ⁿ⁺¹=2(aₙ−3ⁿ) の形に変形し、等比数列とみる。(両辺を 3ⁿ⁺¹ で割る方法もある)","s":"①aₙ₊₁−3ⁿ⁺¹=2aₙ+3ⁿ−3·3ⁿ=2(aₙ−3ⁿ)\n②{aₙ−3ⁿ} は初項 1−3=−2、公比 2 の等比数列\n③aₙ−3ⁿ=−2·2ⁿ⁻¹=−2ⁿ\n④aₙ=3ⁿ−2ⁿ","a":"aₙ=3ⁿ−2ⁿ","p":"a₂=2·1+3=5=3²−2² で検算する。"},{"id":179,"f":"数学B","u":"数列","n":"Sₙ から一般項を求める","q":"数列{aₙ}の初項から第 n 項までの和 Sₙ が Sₙ=n²+2n であるとき、一般項 aₙ を求めよ。","i":"a₁=S₁、n≧2 のとき aₙ=Sₙ−Sₙ₋₁。n=1 のときも成り立つか確認する。","s":"①a₁=S₁=3\n②n≧2: aₙ=(n²+2n)−{(n−1)²+2(n−1)}=2n+1\n③n=1 のとき 2·1+1=3=a₁ → すべての n で aₙ=2n+1","a":"aₙ=2n+1","p":"n=1 を別に調べ、n≧2 の式に含められるかを確認する。"},{"id":180,"f":"数学B","u":"数列","n":"和と一般項の関係から漸化式を作る","q":"数列{aₙ}の初項から第 n 項までの和 Sₙ が Sₙ=2aₙ−n を満たすとき、aₙ を求めよ。","i":"n=1 で a₁=S₁。aₙ₊₁=Sₙ₊₁−Sₙ を計算して aₙ₊₁ と aₙ の漸化式を作る。","s":"①n=1: a₁=2a₁−1 → a₁=1\n②aₙ₊₁=Sₙ₊₁−Sₙ={2aₙ₊₁−(n+1)}−(2aₙ−n) → aₙ₊₁=2aₙ+1\n③aₙ₊₁+1=2(aₙ+1)、a₁+1=2 → aₙ+1=2ⁿ\n④aₙ=2ⁿ−1","a":"aₙ=2ⁿ−1","p":"a₁=S₁ を別に求める。S₂=3+... で a₂=3 などと検算する。"},{"id":181,"f":"数学B","u":"数列","n":"群数列","q":"数列 1 | 2, 2 | 3, 3, 3 | 4, 4, 4, 4 | … のように、第 n 群に n が n 個並ぶ。(1)第100項は何か (2)最初の 10 は第何項か。","i":"第 n 群の終わりまでの項数 n(n+1)/2 を使い、何番目の項が第何群にあるかを調べる。","s":"①第 n 群までの項数=n(n+1)/2\n②(1)13·14/2=91<100≦14·15/2=105 → 第100項は第14群 → 14\n③(2)第9群までの項数=9·10/2=45 → 最初の 10 は第46項","a":"(1)14 (2)第46項","p":"「第 n 群の最初の項の番号」=(第 n−1 群までの項数)+1。"},{"id":182,"f":"数学B","u":"数列","n":"数学的帰納法","q":"すべての自然数 n について 1·2+2·3+…+n(n+1)=n(n+1)(n+2)/3 が成り立つことを、数学的帰納法で証明せよ。","i":"(I) n=1 で成り立つ (II) n=k で成り立つと仮定して n=k+1 でも成り立つ、の2段階を示す。","s":"①(I)n=1: 左辺=1·2=2、右辺=1·2·3/3=2 → 成り立つ\n②(II)n=k のとき成り立つと仮定: 1·2+…+k(k+1)=k(k+1)(k+2)/3\n③両辺に (k+1)(k+2) を加えると 左辺=k(k+1)(k+2)/3+(k+1)(k+2)=(k+1)(k+2)(k+3)/3\n④これは n=k+1 のときの右辺と一致 → (I)(II)よりすべての自然数 n で成り立つ","a":"(証明)(I)n=1 のとき成立。(II)n=k の成立を仮定して n=k+1 の成立を示す。(I)(II)より、すべての自然数 n で成立。","p":"仮定を使う箇所を明示する。(I)と(II)の両方を必ず書く。"},{"id":183,"f":"数学B","u":"数列","n":"漸化式の立式(図形の分割)","q":"平面上に n 本の直線があり、どの2本も平行でなく、どの3本も1点で交わらないとする。これらの直線が平面を分ける部分の個数を aₙ とするとき、aₙ を n で表せ。","i":"(n+1) 本目の直線は、既にある n 本と n 個の点で交わり、(n+1) 個の部分に分けられる。そのため領域が (n+1) 個増える。aₙ₊₁=aₙ+(n+1)。","s":"①a₁=2\n②aₙ₊₁=aₙ+(n+1)\n③n≧2: aₙ=2+Σ_{k=2}^{n}k=1+n(n+1)/2\n④n=1 のとき 2 で成り立つ → aₙ=(n²+n+2)/2","a":"aₙ=(n²+n+2)/2","p":"n=3 のとき7個になるか検算する。増える個数の理由を図で理解しておく。"},{"id":184,"f":"数学B","u":"数列","n":"等差数列の和の最大","q":"初項 50、公差 −6 の等差数列について、初項から第 n 項までの和 Sₙ が最大となる n と、その最大値を求めよ。","i":"項が正の間は和が増え、負になると減る。aₙ>0 を満たす最大の n を調べる。","s":"①aₙ=50−6(n−1)=56−6n\n②a₉=2>0、a₁₀=−4<0\n③Sₙ は n=9 で最大 S₉=9(50+2)/2=234","a":"n=9 のとき最大値 234","p":"項が 0 になる場合(aₙ=0)は、その前後どちらの n でも和は等しく最大。"},{"id":185,"f":"数学B","u":"数列","n":"等比数列の和が条件を超える最小の n","q":"初項 1、公比 2 の等比数列について、初項から第 n 項までの和が 1000 を超える最小の自然数 n を求めよ。","i":"Sₙ=2ⁿ−1 を求めて、不等式 2ⁿ−1>1000 を満たす最小の n を、2ⁿ の値を調べて決める。","s":"①Sₙ=(2ⁿ−1)/(2−1)=2ⁿ−1>1000 → 2ⁿ>1001\n②2⁹=512, 2¹⁰=1024\n③最小の n=10","a":"n=10","p":"2¹⁰=1024 を覚えておく。n=9 では S₉=511 で不足。"},{"id":186,"f":"数学C","u":"ベクトル","n":"ベクトルの成分計算と大きさ","q":"→a=(2,−1), →b=(1,3) のとき、2→a−3→b の成分と、|→a+→b| を求めよ。","i":"成分ごとに計算する。大きさは |(x,y)|=√(x²+y²)。","s":"①2→a−3→b=(4−3, −2−9)=(1,−11)\n②→a+→b=(3,2) → |→a+→b|=√(9+4)=√13","a":"2→a−3→b=(1,−11)、|→a+→b|=√13","p":"係数を各成分にかけ忘れない。"},{"id":187,"f":"数学C","u":"ベクトル","n":"内積と、なす角の余弦","q":"→a=(1,2), →b=(3,−1) のとき、内積 →a·→b と、2つのベクトルのなす角 θ の cosθ を求めよ。","i":"成分表示の内積 →a·→b=x₁x₂+y₁y₂。cosθ=(→a·→b)/(|→a||→b|)。","s":"①→a·→b=1·3+2·(−1)=1\n②|→a|=√5, |→b|=√10\n③cosθ=1/(√5·√10)=1/(5√2)=√2/10","a":"内積 1、cosθ=√2/10","p":"cosθ=(内積)÷(大きさの積)。分母の有理化を忘れない。"},{"id":188,"f":"数学C","u":"ベクトル","n":"ベクトルの平行条件・垂直条件","q":"→a=(2,3), →b=(k,−4) について、(1)→a∥→b (2)→a⊥→b となる k の値をそれぞれ求めよ。","i":"平行 ⇔ x₁y₂−x₂y₁=0(→b=t→a)、垂直 ⇔ 内積 x₁x₂+y₁y₂=0。","s":"①(1)平行: 2·(−4)−3·k=0 → k=−8/3\n②(2)垂直: 2k+3·(−4)=0 → k=6","a":"(1)k=−8/3 (2)k=6","p":"平行条件と垂直条件を混同しない(平行は「たすき掛けの差=0」、垂直は「内積=0」)。"},{"id":189,"f":"数学C","u":"ベクトル","n":"内積と大きさの計算(展開)","q":"|→a|=2, |→b|=3, →a·→b=3 のとき、|→a−2→b| の値を求めよ。","i":"|→p|²=→p·→p を使い、展開して |→a|², |→b|², →a·→b で表す。","s":"①|→a−2→b|²=|→a|²−4→a·→b+4|→b|²\n②=4−4·3+4·9=28\n③|→a−2→b|=√28=2√7","a":"2√7","p":"大きさは2乗して計算する。−2·2=−4 の係数に注意。"},{"id":190,"f":"数学C","u":"ベクトル","n":"内分点の位置ベクトル","q":"△OAB で →OA=→a, →OB=→b とする。辺 AB を 2:1 に内分する点を P とするとき、→OP を →a, →b で表せ。","i":"A, B を m:n に内分する点の位置ベクトルは (n→a+m→b)/(m+n)。","s":"①P は AB を 2:1 に内分する点\n②→OP=(1·→a+2·→b)/(2+1)=(→a+2→b)/3","a":"→OP=(→a+2→b)/3","p":"近い方の端点に「遠い方の比」がかかる(たすき掛け)。→OP=→OA+(2/3)→AB と考えて検算できる。"},{"id":191,"f":"数学C","u":"ベクトル","n":"交点の位置ベクトル(係数比較)","q":"△OAB で →OA=→a, →OB=→b とする。辺 AB を 2:1 に内分する点を P、辺 OB を 1:2 に内分する点を Q とし、線分 OP と線分 AQ の交点を R とする。→OR を →a, →b で表せ。","i":"R を「OP 上の点」と「AQ 上の点」の2通りで →a, →b の1次結合で表し、→a, →b が一次独立であることから係数を比較する。","s":"①→OP=(→a+2→b)/3, →OQ=→b/3\n②R は OP 上: →OR=s→OP=(s/3)→a+(2s/3)→b\n③R は AQ 上: →OR=(1−t)→a+t→OQ=(1−t)→a+(t/3)→b\n④係数比較: s/3=1−t, 2s/3=t/3 → t=2s → s=3/7, t=6/7\n⑤→OR=(1/7)→a+(2/7)→b","a":"→OR=(1/7)→a+(2/7)→b","p":"→a, →b が一次独立であること(係数比較の根拠)を明記する。直線上の点は1文字(s, t)で表す。"},{"id":192,"f":"数学C","u":"ベクトル","n":"三角形の面積(成分)","q":"A(1,2), B(4,3), C(2,6) のとき、△ABC の面積を求めよ。","i":"→AB=(p,q), →AC=(r,s) のとき、面積 S=(1/2)|ps−qr|。","s":"①→AB=(3,1), →AC=(1,4)\n②S=(1/2)|3·4−1·1|=11/2","a":"11/2","p":"絶対値をとる。ps−qr の順序(たすき掛けの差)を間違えない。"},{"id":193,"f":"数学C","u":"ベクトル","n":"直線のベクトル方程式","q":"点 A(1,2) を通り、方向ベクトルが →d=(3,−1) である直線について、媒介変数 t を用いた表示と、x, y の方程式を求めよ。","i":"直線上の点 P は →OP=→OA+t→d。成分で表し、t を消去して x, y の方程式にする。","s":"①(x,y)=(1,2)+t(3,−1)=(1+3t, 2−t)\n②x−1=3t, y−2=−t → x−1=−3(y−2)\n③x+3y−7=0","a":"(x,y)=(1+3t, 2−t)、x+3y−7=0","p":"方向ベクトル (3,−1) と傾き −1/3 の対応を確認する。"},{"id":194,"f":"数学C","u":"ベクトル","n":"空間ベクトルと三角形の面積","q":"空間の3点 A(1,0,0), B(0,2,0), C(0,0,3) について、△ABC の面積を求めよ。","i":"S=(1/2)√(|→AB|²|→AC|²−(→AB·→AC)²)。(空間では2次元の成分の公式は使えない)","s":"①→AB=(−1,2,0), →AC=(−1,0,3)\n②|→AB|²=5, |→AC|²=10, →AB·→AC=1\n③S=(1/2)√(5·10−1²)=(1/2)√49=7/2","a":"7/2","p":"別解: cos∠A=1/(5√2) から sin∠A を求め S=(1/2)|AB||AC|sin∠A としてもよい。"},{"id":195,"f":"数学C","u":"ベクトル","n":"同一平面上にある条件(空間ベクトル)","q":"空間の3点 A(1,0,0), B(0,1,0), C(0,0,1) を通る平面上に点 P(2,−1,k) があるとき、k の値を求めよ。","i":"P が平面 ABC 上 ⇔ →AP=s→AB+t→AC(s, t は実数)と表せる。成分を比べる。","s":"①→AP=(1,−1,k), →AB=(−1,1,0), →AC=(−1,0,1)\n②s→AB+t→AC=(−s−t, s, t)\n③s=−1, t=k, −s−t=1 → 1−k=1 → k=0","a":"k=0","p":"3点 A, B, C が一直線上にないこと(→AB, →AC が一次独立)が前提。"},{"id":196,"f":"数学B","u":"確率分布と統計的推測","n":"確率変数の期待値・分散・標準偏差","q":"確率変数 X の確率分布が P(X=0)=1/4, P(X=1)=1/2, P(X=2)=1/4 であるとき、E(X), V(X), σ(X) を求めよ。","i":"E(X)=Σxp、V(X)=E(X²)−{E(X)}²、σ(X)=√V(X)。","s":"①E(X)=0·(1/4)+1·(1/2)+2·(1/4)=1\n②E(X²)=0+1·(1/2)+4·(1/4)=3/2\n③V(X)=3/2−1²=1/2、σ(X)=√2/2","a":"E(X)=1, V(X)=1/2, σ(X)=√2/2","p":"V(X)=E(X²)−{E(X)}²。E(X)² と E(X²) を混同しない。"},{"id":197,"f":"数学B","u":"確率分布と統計的推測","n":"Y=aX+b の期待値・分散","q":"確率変数 X について E(X)=3, V(X)=4 のとき、Y=2X−1 の期待値、分散、標準偏差を求めよ。","i":"E(aX+b)=aE(X)+b、V(aX+b)=a²V(X)、σ(aX+b)=|a|σ(X)。","s":"①E(Y)=2·3−1=5\n②V(Y)=2²·4=16\n③σ(Y)=√16=4","a":"E(Y)=5, V(Y)=16, σ(Y)=4","p":"分散には a² がかかり、b は影響しない。"},{"id":198,"f":"数学B","u":"確率分布と統計的推測","n":"二項分布の期待値・分散","q":"当たる確率が 1/5 のくじを、引くたびにもとに戻しながら 100 回引く。当たる回数を X とするとき、E(X), V(X), σ(X) を求めよ。","i":"X は二項分布 B(n,p) に従う。E(X)=np、V(X)=np(1−p)、σ(X)=√V(X)。","s":"①X は B(100, 1/5) に従う\n②E(X)=100·(1/5)=20\n③V(X)=100·(1/5)·(4/5)=16\n④σ(X)=4","a":"E(X)=20, V(X)=16, σ(X)=4","p":"V(X)=np(1−p) の (1−p) のかけ忘れ。"},{"id":199,"f":"数学B","u":"確率分布と統計的推測","n":"正規分布と確率の計算","q":"確率変数 X が正規分布 N(50, 10²) に従うとき、P(40≦X≦70) を求めよ。ただし、標準正規分布について P(0≦Z≦1)=0.3413, P(0≦Z≦2)=0.4772 とする。","i":"Z=(X−m)/σ で標準化し、標準正規分布の表(与えられた値)を使って確率を求める。左右対称性も利用する。","s":"①Z=(X−50)/10 とおくと Z は N(0,1) に従う\n②40≦X≦70 ⇔ −1≦Z≦2\n③P(−1≦Z≦2)=P(0≦Z≦1)+P(0≦Z≦2)=0.3413+0.4772=0.8185","a":"0.8185","p":"P(−1≦Z≦0)=P(0≦Z≦1) の対称性を使う。表の値は 0 から z までの確率かを確認する。"},{"id":200,"f":"数学B","u":"確率分布と統計的推測","n":"母平均の推定(信頼区間)","q":"母標準偏差が 10 である母集団から、大きさ 100 の無作為標本を抽出したところ、標本平均が 50 であった。母平均 m に対する信頼度 95% の信頼区間を求めよ。(信頼度 95% に対応する値 1.96 を用いてよい)","i":"標本平均 x̄ のとき、母平均 m の信頼度95%の信頼区間は x̄−1.96·σ/√n ≦ m ≦ x̄+1.96·σ/√n。","s":"①σ/√n=10/√100=1\n②1.96×1=1.96\n③50−1.96≦m≦50+1.96","a":"48.04≦m≦51.96","p":"n が大きいときは標本標準偏差を母標準偏差の代わりに使う場合がある(問題文の指示に従う)。"}];
const $=id=>document.getElementById(id);
const byId={};DATA.forEach(x=>byId[x.id]=x);
const KEY='gmath_stock_v1';let mem=[];
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v.filter(i=>byId[i]):[]}catch(e){return mem.filter(i=>byId[i])}}
function save(a){mem=a;try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const FO=['数学Ⅰ','数学A','数学Ⅱ','数学B','数学C'];
const units=[];DATA.forEach(x=>{if(!units.find(u=>u.u===x.u))units.push({f:x.f,u:x.u,n:0})});
units.forEach(u=>u.n=DATA.filter(x=>x.u===u.u).length);
units.sort((a,b)=>FO.indexOf(a.f)-FO.indexOf(b.f));
let mode='unit',unit=units[0].u,cnt=10,Q=[],i=0,okN=0,ngN=0,missed=[],cur='unit',shown=false;

function seg(el,items,c,on){el.innerHTML=items.map(([v,l])=>`<button aria-pressed="${v==c}" data-v="${v}">${l}</button>`).join('');el.onclick=e=>{const b=e.target.closest('button');if(b)on(b.dataset.v)}}
function show(id){['home','quiz','result'].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0)}
function home(){
  const n=load().length;
  seg($('mode'),[['unit','単元別'],['random','ランダム']],mode,v=>{mode=v;home()});
  $('unitBox').hidden=mode!=='unit';$('cntBox').hidden=mode!=='random';
  seg($('cnt'),[5,10,20].map(c=>[c,c+'問']),cnt,v=>{cnt=+v;home()});
  let h='',lf='';
  units.forEach(u=>{if(u.f!==lf){h+=`<div class="fl">${u.f}</div>`;lf=u.f}
    h+=`<button class="ub" aria-pressed="${u.u===unit}" data-u="${esc(u.u)}"><span>${esc(u.u)}</span><span>${u.n}問</span></button>`});
  $('units').innerHTML=h;
  $('units').onclick=e=>{const b=e.target.closest('.ub');if(b){unit=b.dataset.u;home()}};
  $('sn').textContent=n+' 問';$('stk').disabled=n===0;
  show('home');
}
function begin(items,m){
  if(!items.length)return;
  Q=items;i=0;okN=0;ngN=0;missed=[];cur=m;show('quiz');ask();
}
const startMain=()=>begin(mode==='unit'?shuffle(DATA.filter(x=>x.u===unit)):shuffle(DATA).slice(0,cnt),mode);
const startStock=()=>begin(shuffle(load().map(id=>byId[id])),'stock');
function ask(){
  const it=Q[i];shown=false;
  $('prog').textContent=(i+1)+' / '+Q.length;$('bar').style.width=(i/Q.length*100)+'%';
  $('tag').textContent=it.f+' ・ '+it.u;$('q').textContent=it.q;
  $('pn').textContent=it.n;$('idea').textContent=it.i;$('ans').textContent=it.a;$('steps').textContent=it.s;$('pit').textContent=it.p;
  $('back').hidden=true;$('judge').hidden=true;$('show').hidden=false;
}
function reveal(){if(shown)return;shown=true;$('back').hidden=false;$('show').hidden=true;$('judge').hidden=false;$('judge').scrollIntoView({block:'nearest'})}
function mark(ok){
  if(!shown)return;
  const it=Q[i];let s=load();
  if(ok){okN++;if(cur==='stock')s=s.filter(x=>x!==it.id)}
  else{ngN++;missed.push(it);if(!s.includes(it.id))s.push(it.id)}
  save(s);
  i++;i>=Q.length?finish():ask();
}
function finish(){
  $('bar').style.width='100%';
  const n=load().length;
  $('rl').textContent=cur==='stock'?'ストック演習の結果':'演習の結果';
  $('score').textContent='覚えた '+okN+' / 覚えていない '+ngN;
  $('sub').textContent=cur==='stock'?(n===0?'ストックはすべてなくなりました。':'ストックに残り '+n+' 問'):'ストック合計 '+n+' 問';
  $('miss').innerHTML=missed.map(x=>`<li><b>${esc(x.n)}</b>${esc(x.q)}</li>`).join('');
  $('missWrap').hidden=!missed.length;$('stk2').disabled=n===0;$('again').hidden=cur==='stock'&&n===0;
  show('result');
}
$('go').onclick=startMain;$('stk').onclick=$('stk2').onclick=startStock;
$('again').onclick=()=>cur==='stock'?startStock():startMain();
$('quit').onclick=$('hm').onclick=home;
$('show').onclick=reveal;$('bn').onclick=()=>mark(false);$('by').onclick=()=>mark(true);
document.addEventListener('keydown',e=>{
  if($('quiz').hidden)return;
  if(!shown&&e.key==='Enter')reveal();
  else if(shown&&e.key==='1')mark(false);else if(shown&&e.key==='2')mark(true);
});
home();
</script>
